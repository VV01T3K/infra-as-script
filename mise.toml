# Tools and commands for this repo.
# New computer: install mise, then run `mise install` in the repo folder.
# Also needed from the system package manager: podman, git, openssh, openssl.
# `mise tasks` lists every command.

[tools]
"github:olastor/age-plugin-fido2-hmac" = "0.5.0"
gitleaks = "8.30.1"
jq = "1.8.1"
opentofu = "1.13.1"
sops = "3.13.3"
uv = "0.12.22" # installs the Python tools listed in pyproject.toml

[env]
_.path = ["{{ config_root }}/.venv/bin"]
# Not a secret: tells sops to decrypt through the YubiKey plugin (same value for everyone).
SOPS_AGE_KEY = "AGE-PLUGIN-FIDO2-HMAC-1VE5KGMEJ945X6CTRM2TF76"

[hooks]
# Python tools, Ansible collections, then the git hook that runs `mise run pre-commit` before every commit.
postinstall = "uv sync --locked && ansible-galaxy collection install -r requirements.yml -p .collections && { [ -e .git/hooks/pre-commit ] || mise generate git-pre-commit --write; }"

# Tasks that pass on extra options ("[ansible_args]...") run through eval: mise hands them over
# shell-quoted, and only eval removes that quoting (otherwise -e x=1 arrives as 'x=1').

[tasks.install]
description = "Stage 0: install Proxmox on a machine (needs the Ventoy stick)"
usage = '''
arg "<machine>" help="Machine name from inventory/hosts.yml"
arg "[ansible_args]..." help="Extra ansible-playbook options, e.g. --tags verify" var=#true
'''
run = 'eval "ansible-playbook stages/0-install/main.yml -e machine=${usage_machine} ${usage_ansible_args:-}"'
raw = true # interactive: it pauses for your input

[tasks.access]
description = "Stage 1: hand a machine over from the installer key to the keys in keys/"
usage = '''
arg "<machine>" help="Machine name from inventory/hosts.yml"
arg "[ansible_args]..." help="Extra ansible-playbook options" var=#true
'''
run = 'eval "scripts/with-fleet-key.sh ansible-playbook stages/1-access/main.yml -e machine=${usage_machine} ${usage_ansible_args:-}"'
raw = true # interactive: YubiKey touch + PIN to unlock the fleet key

[tasks.host]
description = "Stage 2: set up Proxmox on a machine (packages, power, network, firewall, backup disk, VM support, API token)"
usage = '''
arg "<machine>" help="Machine name from inventory/hosts.yml"
arg "[ansible_args]..." help="Extra ansible-playbook options, e.g. --tags firewall" var=#true
'''
run = 'eval "scripts/with-fleet-key.sh ansible-playbook stages/2-host/main.yml -e machine=${usage_machine} ${usage_ansible_args:-}"'
raw = true # interactive: YubiKey touch + PIN to unlock the fleet key

[tasks.guests]
description = "Stage 3: create the guests (LXCs) and VMs listed in inventory/hosts.yml (shows the plan, asks, then applies)"
usage = 'arg "[tofu_args]..." help="Extra tofu plan options, e.g. -replace=..." var=#true'
run = 'eval "scripts/with-tofu-secrets.sh scripts/tofu-apply.sh stages/3-guests ${usage_tofu_args:-}"'
raw = true # interactive: YubiKey touch + PIN, then "yes" to apply

[tasks.setup]
description = "Stage 4: set up the guests (Python, updates, Docker) and VMs (updates, console password)"
usage = 'arg "[guest]" help="One guest from inventory/hosts.yml (default: all guests)"'
run = "scripts/with-fleet-key.sh ansible-playbook stages/4-setup/main.yml ${usage_guest:+-e guest=$usage_guest}"
raw = true # interactive: YubiKey touch + PIN to unlock the fleet key

[tasks.services]
description = "Stage 5: platform services (Caddy, Arcane manager + agents, the DNS cluster, OpenMediaVault)"
usage = 'arg "[ansible_args]..." help="Extra ansible-playbook options, e.g. --tags dns" var=#true'
run = 'eval "scripts/with-fleet-key.sh scripts/with-service-secrets.sh ansible-playbook stages/5-services/main.yml ${usage_ansible_args:-}"'
raw = true # interactive: two YubiKey touches (fleet key, service secrets)

[tasks.gitops]
description = "Reconcile Arcane GitOps repositories, stack mappings and SOPS-backed project secrets"
usage = 'arg "[ansible_args]..." help="Extra options, e.g. -e gitops_sync_now=true" var=#true'
run = 'eval "scripts/with-fleet-key.sh scripts/with-service-secrets.sh ansible-playbook stages/5-services/gitops.yml ${usage_ansible_args:-}"'
raw = true # interactive: fleet key and service secrets require the YubiKey

[tasks.migrate-frog]
description = "Cut over Frog with preserved SSH key/state, two backups and automatic rollback"
usage = 'arg "[ansible_args]..." help="Extra options, e.g. -e frog_resume=true after inspecting restored volumes" var=#true'
run = 'eval "scripts/with-fleet-key.sh scripts/with-service-secrets.sh ansible-playbook operations/migrate-frog.yml ${usage_ansible_args:-}"'
raw = true # interactive: fleet key and service secrets require the YubiKey

[tasks.inspect-storage]
description = "Read only: disks, their health and the backup storage on the Proxmox machines (plus Research Cruise's database)"
run = "scripts/with-fleet-key.sh ansible-playbook operations/inspect-storage.yml"
raw = true # interactive: YubiKey touch + PIN to unlock the fleet key

[tasks.research-cruise-backup]
description = "Back up Research Cruise's live database (on externum) to both backup disks and prove it by a test restore on zoltan"
run = "scripts/with-fleet-key.sh ansible-playbook operations/research-cruise-backup.yml"
raw = true # interactive: YubiKey touch + PIN to unlock the fleet key

[tasks.inspect-retained-apps]
description = "Read only: retained app versions, volumes, capacity, proxy routes and tunnel origins"
run = "scripts/with-fleet-key.sh ansible-playbook operations/inspect-retained-apps.yml"
raw = true # interactive: YubiKey touch + PIN to unlock the fleet key

[tasks.network]
description = "The router: networks, firewall, switch ports, fixed addresses (shows the plan, asks, then applies)"
run = "scripts/with-tofu-secrets.sh scripts/tofu-apply.sh network"
raw = true # interactive: YubiKey touch + PIN, then "yes" to apply

[tasks.yubikey-ssh]
description = "Once per YubiKey: create its SSH key on the key (touch + PIN), public half goes to keys/"
usage = 'arg "<name>" help="Short name for the YubiKey, e.g. yubikey-c-nfc"'
run = """
ssh-keygen -t ed25519-sk -O resident -O verify-required -O application=ssh:homelab -C "${usage_name}" -f ~/.ssh/id_ed25519_sk_${usage_name}
cp ~/.ssh/id_ed25519_sk_${usage_name}.pub keys/${usage_name}.pub
echo "Added keys/${usage_name}.pub. Stage 1 puts every key in keys/ on the machines."
"""
raw = true # interactive: PIN and touch

[tasks.fleet-key]
description = "Once: create the fleet SSH key, stored encrypted in secrets/ (public half: keys/fleet.pub)"
run = '''
set -e
[ ! -e secrets/fleet-ssh-key.sops.yaml ] || { echo "secrets/fleet-ssh-key.sops.yaml exists; delete it first to rotate the key." >&2; exit 1; }
tmp="$(mktemp -d "${XDG_RUNTIME_DIR:-/tmp}/fleet-key.XXXXXX")"; trap 'rm -rf "$tmp"' EXIT
ssh-keygen -q -t ed25519 -N '' -C fleet@infra-as-script -f "$tmp/key"
{ echo 'ssh_private_key: |'; sed 's/^/  /' "$tmp/key"; } > "$tmp/plain.yaml"
sops encrypt --filename-override secrets/fleet-ssh-key.sops.yaml "$tmp/plain.yaml" > secrets/fleet-ssh-key.sops.yaml
cp "$tmp/key.pub" keys/fleet.pub
echo "Fleet key ready: keys/fleet.pub (private half only in secrets/fleet-ssh-key.sops.yaml)."
'''

[tasks.check]
description = "Lint and validate everything"
run = [
  "ansible-lint",
  "python scripts/check-frog-migration.py",
  "tofu -chdir=stages/3-guests fmt -check -diff",
  "tofu -chdir=network fmt -check -diff",
]

[tasks.pre-commit]
description = "Runs before every commit: block secrets, then check"
run = [
  "gitleaks git --staged --redact --no-banner",
  { task = "check" },
]
