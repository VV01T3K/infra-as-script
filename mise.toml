# Tools and commands for this repo.
# New computer: install mise, then run `mise install` in the repo folder.
# Also needed from the system package manager: podman, git, openssh, openssl.
# `mise tasks` lists every command.

[tools]
"github:olastor/age-plugin-fido2-hmac" = "0.5.0"
gitleaks = "8.30.1"
opentofu = "1.13.1"
sops = "3.13.3"
uv = "0.12.22" # installs the Python tools listed in pyproject.toml

[env]
_.path = ["{{ config_root }}/.venv/bin"]
# Not a secret: tells sops to decrypt through the YubiKey plugin (same value for everyone).
SOPS_AGE_KEY = "AGE-PLUGIN-FIDO2-HMAC-1VE5KGMEJ945X6CTRM2TF76"

[hooks]
# Python tools, Ansible collections, then the git hook that runs `mise run pre-commit` before every commit.
postinstall = "uv sync --locked && ansible-galaxy collection install -r requirements.yml -p .collections && { [ -e .git/hooks/pre-commit ] || mise generate git-pre-commit --write; }"

[tasks.install]
description = "Stage 0: install Proxmox on a machine (needs the Ventoy stick)"
usage = '''
arg "<machine>" help="Machine name from inventory/hosts.yml"
arg "[ansible_args]..." help="Extra ansible-playbook options, e.g. --tags verify" var=#true
'''
run = "ansible-playbook stages/0-install/main.yml -e machine=${usage_machine} ${usage_ansible_args:-}"
raw = true # interactive: it pauses for your input

[tasks.access]
description = "Stage 1: hand a machine over from the installer key to the keys in keys/"
usage = '''
arg "<machine>" help="Machine name from inventory/hosts.yml"
arg "[ansible_args]..." help="Extra ansible-playbook options" var=#true
'''
run = "ansible-playbook stages/1-access/main.yml -e machine=${usage_machine} ${usage_ansible_args:-}"
raw = true # interactive: YubiKey PIN, if a saved secret has to be read

[tasks.yubikey-ssh]
description = "Once per YubiKey: create its SSH key on the key (touch + PIN), public half goes to keys/"
usage = 'arg "<name>" help="Short name for the YubiKey, e.g. yubikey-c-nfc"'
run = """
ssh-keygen -t ed25519-sk -O resident -O verify-required -O application=ssh:homelab -C "${usage_name}" -f ~/.ssh/id_ed25519_sk_${usage_name}
cp ~/.ssh/id_ed25519_sk_${usage_name}.pub keys/${usage_name}.pub
echo "Added keys/${usage_name}.pub. Stage 1 authorizes every key in keys/."
"""
raw = true # interactive: PIN and touch

[tasks.connect]
description = "Spare way in: open a YubiKey SSH connection (touch + PIN); Ansible reuses it for 15 minutes"
usage = 'arg "<machine>" help="Machine name from inventory/hosts.yml"'
run = '''
address="$(ansible-inventory --host "${usage_machine}" --yaml | sed -n 's/^address: //p')"
mkdir -p ~/.ansible/cp
# Same ControlPath as ansible.cfg, so Ansible finds and reuses this connection.
ssh -o ControlMaster=auto -o ControlPersist=15m -o 'ControlPath=~/.ansible/cp/%h-%p-%r' \
  -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519_sk_yubikey-c-nfc -o "UserKnownHostsFile=$PWD/secrets/known_hosts" \
  "root@${address}" true
echo "Connected to ${usage_machine} (${address}) with your YubiKey; Ansible reuses this for 15 minutes."
'''
raw = true # interactive: YubiKey PIN prompt

[tasks.admin-key]
description = "Once per laptop: create its fleet SSH key, public half goes to keys/<laptop>.pub"
run = '''
key=~/.ssh/id_ed25519_homelab
[ -e "$key" ] || ssh-keygen -q -t ed25519 -N '' -C "homelab@$(hostname)" -f "$key"
cp "$key.pub" "keys/$(hostname).pub"
echo "Fleet key: $key (public half: keys/$(hostname).pub). Run stage 1 to put it on machines."
'''

[tasks.check]
description = "Lint and validate everything"
run = "ansible-lint"

[tasks.pre-commit]
description = "Runs before every commit: block secrets, then check"
run = [
  "gitleaks git --staged --redact --no-banner",
  { task = "check" },
]
