# Restore the configuration and a consistent SQLite snapshot before startup.
services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest # updated by Arcane after 72 hours (see stage 5 arcane_settings)
    container_name: crowdsec
    hostname: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/whitelist-good-actors
      BOUNCER_KEY_CADDY: ${CROWDSEC_API_KEY:-}
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: [CMD, cscli, lapi, status]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks: [security, outbound]
    security_opt: [no-new-privileges:true]

networks:
  security:
    external: true
    name: caddy_security
  outbound: {}

volumes:
  crowdsec_config:
    external: true
  crowdsec_data:
    external: true
