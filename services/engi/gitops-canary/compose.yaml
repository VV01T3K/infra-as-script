# Isolated GitOps verification: no ports, persistent data or external integrations.
services:
  canary:
    image: alpine:3.23.3
    command: [sh, -c, 'while :; do sleep 3600; done']
    environment:
      CANARY_REVISION: '1'
      CANARY_TOKEN: ${CANARY_TOKEN:-}
    healthcheck:
      test: [CMD-SHELL, 'test -n "$$CANARY_TOKEN"']
      interval: 10s
      timeout: 2s
      retries: 3
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: '65534:65534'
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.1
