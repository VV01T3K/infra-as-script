---
# The host addresses come from inventory; shared DNS policy lives here.
technitium_records:
  - name: pve.home.arpa
    address: "{{ hostvars['pve'].ansible_host }}"
    ptr: true
  - name: arcane.home.arpa
    address: "{{ hostvars['arcane'].ansible_host }}"
    ptr: true
  - name: dns.home.arpa
    address: "{{ hostvars['arcane'].ansible_host }}"
    ptr: false
dns_external_test_name: example.com
# Set this to a domain verified in your downloaded block lists to test blocking.
dns_blocked_test_name: ""

# All public playbooks live in ansible/playbooks/.
repo_root: "{{ (playbook_dir + '/../..') | realpath }}"
