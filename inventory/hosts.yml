# The fleet: every network and machine, in one place.
# Ansible and OpenTofu (stage 3) read this file directly. Nothing else in the repo hardcodes an address.

all:
  vars:
    domain: lab.wsiwiec.com
    # Arcane's dashboard, served by Caddy (stage 5).
    arcane_host: arcane.{{ domain }}

    locale:
      keyboard: pl
      country: pl
      timezone: Europe/Warsaw

    # The router (UniFi UCG Ultra): `mise run network` makes it match these networks, see network/.
    # unifi_name: the network's name in UniFi. dhcp.dns: "technitium" = the dns group below,
    # "gateway" = the router itself. dhcp.domain: search domain handed out (default: domain above).
    unifi: { address: 10.0.0.1 }
    networks:
      management: # servers; the router's own DNS, so it works even when the DNS guests are down
        unifi_name: Default
        vlan: 1
        subnet: 10.1.0.0/24
        gateway: 10.1.0.1
        dns: 10.1.0.1
        dhcp: { start: 10.1.0.200, stop: 10.1.0.254, dns: gateway, domain: localdomain }
      personal: # laptops, phones, Wi-Fi
        unifi_name: Personal
        vlan: 10
        subnet: 10.0.0.0/24
        gateway: 10.0.0.1
        dhcp: { start: 10.0.0.6, stop: 10.0.0.254, dns: technitium }
      infra: # guests (not 10.2.0.x: Proton VPN uses it)
        unifi_name: Infra
        vlan: 20
        subnet: 10.20.0.0/24
        gateway: 10.20.0.1
        dhcp: { start: 10.20.0.200, stop: 10.20.0.250, dns: technitium }
      agents: { vlan: 30, subnet: 10.30.0.0/24, planned: true } # not created yet

    # Networks allowed to reach SSH and admin UIs.
    admin_from: [management, personal]

    # Who may log in as root once stage 1 has run: exactly the public keys in keys/
    # (plus the machine's own root key, /root/.ssh/id_*.pub, which Proxmox adds for itself).
    #   keys/fleet.pub      repo commands; private half encrypted in secrets/, loaded per command
    #   keys/yubikey-*.pub  YubiKey keys (`mise run yubikey-ssh <name>`): your manual SSH
    admin_key: "{{ inventory_dir }}/../keys/fleet.pub"

    # How Ansible logs in once stage 1 has run: as root, with the fleet key (from the temporary agent).
    ansible_host: "{{ address }}"
    ansible_user: root
    ansible_ssh_private_key_file: "{{ admin_key }}"
    ansible_ssh_common_args: -o IdentitiesOnly=yes -o UserKnownHostsFile={{ inventory_dir }}/../secrets/known_hosts

  children:
    proxmox:
      vars:
        # "powersave" lets the CPU slow down when idle and still speed up under load
        # (Proxmox's default, "performance", keeps it at full speed all the time).
        cpu_governor: powersave
        # Official ISO to build installers from; checksum from https://enterprise.proxmox.com/iso/SHA256SUMS
        proxmox_iso:
          file: proxmox-ve_9.2-1.iso
          sha256: 4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c
      hosts:
        torus:
          network: management
          address: 10.1.0.30
          mac: c4:65:16:af:f3:ea
          install:
            disk_serial: S425NA0M403712 # Samsung PM981 256 GB
            filesystem: ext4
          # The "backup" storage. Stage 2 mounts its filesystem as it is; it never formats it on its own.
          backup_disk: { serial: QA7202W000653P1109 } # AirDisk
          # USB devices handed whole to a VM (stage 2 makes a Proxmox "USB mapping" for each, found by disk serial).
          usb_mappings:
            nas-hdd: { disk_serial: W380WY6S } # Seagate SSHD 1 TB: OpenMediaVault's data disk
          old_boot_entries: [Fedora] # left by the system that ran here before; stage 2 removes them
        kestrel: # GMKtec NucBox G3 Plus, Intel N150
          network: management
          address: 10.1.0.2
          mac: e0:51:d8:1a:12:db
          install:
            disk_serial: QDK662R021245P112W # Lexar NM620 512 GB
            filesystem: ext4
          # The "backup" storage, mounted as it is. It holds the old Proxmox's backups.
          backup_disk: { serial: S32XJ9AH421216 } # Seagate 1 TB HDD
          # Windows from before; "Ventoy USB" was added by hand to boot the installer once.
          old_boot_entries: [Windows Boot Manager, Ventoy USB]

    # Guests: LXCs that stage 3 (OpenTofu) creates on their machine ("node"), and removes when
    # they are no longer listed here. Each is unprivileged Alpine with Docker allowed (nesting).
    # vmid = VLAN x 100 + the address's last number. memory in MB, disk in GB.
    guests:
      vars:
        network: infra
        # How Ansible reaches a guest (stage 4 on): SSH to its Proxmox machine as root with the fleet key
        # (from the temporary agent only), then `pct exec <vmid>`. Guests run no SSH server.
        ansible_connection: community.proxmox.proxmox_pct_remote
        ansible_host: "{{ hostvars[node].address }}"
        proxmox_vmid: "{{ vmid }}"
        ansible_paramiko_private_key_file: "" # keys/fleet.pub is only for OpenSSH; paramiko uses the agent
        # Proxmox's Alpine template. download.proxmox.com is plain HTTP (its HTTPS certificate is for other
        # names); the checksum protects the file. It comes from http://download.proxmox.com/images/aplinfo-pve-9.dat,
        # whose signature (.asc) checks out against the Proxmox Trixie Release Key 24B3 0F06 ... 0BFE 778E.
        lxc_template:
          url: http://download.proxmox.com/images/system/alpine-3.24-default_20260714_amd64.tar.xz
          sha512: 9877b74de4c4878b70450502618f7b02952e792afdbc91f146f6cba507432dae516674d0bb3a306484d58edc722ff63db1ed3c4e5b0954fb2a2773ec8d8f33bd
      hosts:
        # 1 GB: Technitium keeps all blocked domains (25 lists) in memory.
        dns1: { node: kestrel, vmid: 2054, address: 10.20.0.54, cores: 1, memory: 1024, disk: 4 } # Technitium
        dns2: { node: torus, vmid: 2055, address: 10.20.0.55, cores: 1, memory: 1024, disk: 4 } # Technitium
        # Docker hosts (FTL race names: several stacks each). zoltan: Caddy, Arcane manager, apps. engi: later S3.
        zoltan: { node: kestrel, vmid: 2010, address: 10.20.0.10, cores: 4, memory: 8192, disk: 100 }
        engi: { node: torus, vmid: 2020, address: 10.20.0.20, cores: 2, memory: 2048, disk: 16 }

    # VMs: full virtual machines that stage 3 creates on their machine from Debian's cloud image (cloud-init sets
    # the address and root's SSH keys = keys/*.pub). Unlike the LXC guests they run their own SSH server, which is
    # how Ansible reaches them. vmid and sizes as for guests; usb = USB mappings of the node handed to the VM.
    vms:
      vars:
        network: infra
        # Set, not discovered: in stage 5 a Python path found on this computer (/usr/bin/python3.14) ended up
        # recorded for the VM twice. Debian always has /usr/bin/python3.
        ansible_python_interpreter: /usr/bin/python3
        # The first login records the VM's host key in secrets/known_hosts. A rebuilt VM has a new key; `mise run
        # guests` forgets the old one of every VM it creates (scripts/tofu-apply.sh).
        ansible_ssh_common_args: >-
          -o IdentitiesOnly=yes -o UserKnownHostsFile={{ inventory_dir }}/../secrets/known_hosts -o StrictHostKeyChecking=accept-new
        # Debian 13 "generic" cloud image: the normal kernel. (The "genericcloud" image's kernel has no USB support,
        # so a passed-through USB disk stays invisible.) Debian doesn't sign these per build: HTTPS plus the pinned
        # checksum from https://cloud.debian.org/images/cloud/trixie/20261001-2618/SHA512SUMS.
        vm_image:
          url: https://cloud.debian.org/images/cloud/trixie/20261001-2618/debian-13-generic-amd64-20261001-2618.qcow2
          sha512: 6f0f93335bdef4ccf523c4317cc663ea52ca23b862667785f3d6d186ab4674a937385ccff0c55996b4b2e4c19e440cdf211e2a75ffa2f6548037ab43950c841d
      hosts:
        # OpenMediaVault (stage 5): file shares and backups on the USB HDD. disk = its own system disk.
        # data_disk: serial of the disk OMV keeps its shares on (stage 5).
        nas: { node: torus, vmid: 2040, address: 10.20.0.40, cores: 2, memory: 2048, disk: 8, usb: [nas-hdd], data_disk: W380WY6S }

    # Stage 5: where Caddy (the HTTPS proxy) and the Arcane manager run. Every other guest gets an Arcane agent.
    # The dashboard (browser and agents) is at https://arcane_host (all.vars).
    proxy:
      hosts:
        zoltan:
    arcane_manager:
      hosts:
        zoltan:

    # The DNS cluster (stage 5). The first host is the primary node, which holds the configuration.
    dns:
      hosts:
        dns1:
        dns2:
