# The fleet: every network and machine, in one place.
# Ansible reads this file directly. Nothing else in the repo hardcodes an address.

all:
  vars:
    domain: lab.wsiwiec.com

    locale:
      keyboard: pl
      country: pl
      timezone: Europe/Warsaw

    # Networks are configured on the UniFi router by hand; this only describes them.
    networks:
      management: { vlan: 1, subnet: 10.1.0.0/24, gateway: 10.1.0.1, dns: 10.1.0.1 } # servers
      personal: { vlan: 10, subnet: 10.0.0.0/24, gateway: 10.0.0.1 } # laptops, phones, Wi-Fi
      infra: { vlan: 20, subnet: 10.20.0.0/24, gateway: 10.20.0.1, dns: 10.20.0.53 } # guests (not 10.2.0.x: Proton VPN uses it)
      agents: { vlan: 30, subnet: 10.30.0.0/24, planned: true } # not created yet

    # Networks allowed to reach SSH and admin UIs.
    admin_from: [management, personal]

    # Who may log in as root once stage 1 has run: exactly the public keys in keys/
    # (plus Proxmox's own root@<node> keys).
    #   keys/fleet.pub      repo commands; private half encrypted in secrets/, loaded per command
    #   keys/yubikey-*.pub  YubiKey keys (`mise run yubikey-ssh <name>`): your manual SSH
    admin_key: "{{ inventory_dir }}/../keys/fleet.pub"

    # How Ansible logs in once stage 1 has run: as root, with the fleet key (from the temporary agent).
    ansible_host: "{{ address }}"
    ansible_user: root
    ansible_ssh_private_key_file: "{{ admin_key }}"
    ansible_ssh_common_args: -o IdentitiesOnly=yes -o UserKnownHostsFile={{ inventory_dir }}/../secrets/known_hosts

  children:
    proxmox:
      vars:
        # "powersave" lets the CPU slow down when idle and still speed up under load
        # (Proxmox's default, "performance", keeps it at full speed all the time).
        cpu_governor: powersave
        # Official ISO to build installers from; checksum from https://enterprise.proxmox.com/iso/SHA256SUMS
        proxmox_iso:
          file: proxmox-ve_9.2-1.iso
          sha256: 4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c
      hosts:
        torus:
          network: management
          address: 10.1.0.30
          mac: c4:65:16:af:f3:ea
          install:
            disk_serial: S425NA0M403712 # Samsung PM981 256 GB
            filesystem: ext4
          # Becomes the "backup" storage. wipe: true = stage 2 empties and formats it once.
          backup_disk: { serial: QA7202W000653P1109, wipe: true } # AirDisk
          old_boot_entries: [Fedora] # left by the system that ran here before; stage 2 removes them
        kestrel: # GMKtec NucBox G3 Plus, Intel N150
          network: management
          address: 10.1.0.2
          mac: e0:51:d8:1a:12:db
          install:
            disk_serial: QDK662R021245P112W # Lexar NM620 512 GB
            filesystem: ext4
          # wipe: false = stage 2 uses the disk's filesystem as it is. It holds the old Proxmox's backups.
          backup_disk: { serial: S32XJ9AH421216, wipe: false } # Seagate 1 TB HDD
          # Windows from before; "Ventoy USB" was added by hand to boot the installer once.
          old_boot_entries: [Windows Boot Manager, Ventoy USB]
