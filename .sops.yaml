# Which keys can open encrypted files (*.sops.yaml) in this repo.
# Each YubiKey is one recipient; any one of them can decrypt (touch + PIN).
# Recipients are public. After adding or removing one, run: sops updatekeys <file>
keys:
  - &yubikey_c_nfc age1fido2- # Security Key C NFC (USB-C), everyday key
  - &yubikey_nfc age1fido2- # Security Key NFC (USB-A), backup key
creation_rules:
  - path_regex: \.sops\.ya?ml$
    key_groups:
      - age:
          - *yubikey_c_nfc
          - *yubikey_nfc
