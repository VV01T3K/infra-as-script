---
- name: Require an explicit update target
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.assert:
        that:
          - system_update_hosts is defined
          - system_update_hosts | default('') | length > 0
          - query('inventory_hostnames', system_update_hosts | default('')) | length > 0
        fail_msg: Pass -e system_update_hosts=pve (or an inventory group).
    - ansible.builtin.import_role:
        name: controller
        tasks_from: lock

- name: Update installed operating system packages
  hosts: "{{ system_update_hosts | default('all') }}"
  serial: 1
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - ansible.builtin.import_role:
        name: maintenance
        tasks_from: packages

- name: Release the maintenance lock after successful updates
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: controller
        tasks_from: unlock
