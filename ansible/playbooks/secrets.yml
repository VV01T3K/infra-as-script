---
- name: Lock deployment and maintenance on this checkout
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Lock deployment and maintenance on this checkout
    ansible.builtin.import_role:
      name: controller
      tasks_from: lock
    when: secrets_action | default('status') != 'status'
- name: Prepare credential management
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Prepare credential management
    ansible.builtin.import_role:
      name: credentials
      tasks_from: prepare
- name: Load the applied OpenTofu inventory
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Load the applied OpenTofu inventory
    ansible.builtin.import_role:
      name: controller
      tasks_from: inventory
    when: secrets_action | default('status') == 'rotate'
- name: Generate or rotate managed credentials
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Generate or rotate managed credentials
    ansible.builtin.import_role:
      name: credentials
      tasks_from: manage
- name: Release the lock after successful completion
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Release the lock after successful completion
    ansible.builtin.import_role:
      name: controller
      tasks_from: unlock
    when: secrets_action | default('status') != 'status'
