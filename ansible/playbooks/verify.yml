- name: Load the applied OpenTofu inventory
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Load the applied OpenTofu inventory
    ansible.builtin.import_role:
      name: controller
      tasks_from: inventory
- name: Verify the application host and web services
  hosts: arcane
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Verify the application host and web services
    ansible.builtin.import_role:
      name: controller
      tasks_from: health
- name: Verify DNS from the controller through the LAN
  hosts: arcane
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Verify DNS from the controller through the LAN
    ansible.builtin.import_role:
      name: technitium
      tasks_from: verify
    when:
    - manage_dns | default(false) | bool
