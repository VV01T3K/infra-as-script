- name: Lock deployment and maintenance on this checkout
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Validate the backup scope
    ansible.builtin.assert:
      that: backup_scope | default('all') in ['all', 'controller']
  - name: Lock deployment and maintenance on this checkout
    ansible.builtin.import_role:
      name: controller
      tasks_from: lock
- name: Load the applied OpenTofu inventory
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Load the applied OpenTofu inventory
    ansible.builtin.import_role:
      name: controller
      tasks_from: inventory
    when: backup_scope | default('all') == 'all'
- name: Verify the application host and web services
  hosts: arcane
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Verify the application host and web services
    ansible.builtin.import_role:
      name: controller
      tasks_from: health
    when: backup_scope | default('all') == 'all'
- name: Verify DNS from the controller through the LAN
  hosts: arcane
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Verify DNS from the controller through the LAN
    ansible.builtin.import_role:
      name: technitium
      tasks_from: verify
    when:
    - backup_scope | default('all') == 'all'
    - manage_dns | default(false) | bool
- name: Encrypt a controller backup
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars_prompt:
  - name: backup_passphrase
    prompt: Controller backup passphrase (retain it for recovery)
    private: true
    confirm: true
  tasks:
  - name: Encrypt a controller backup
    ansible.builtin.import_role:
      name: controller
      tasks_from: backup
- name: Pause automatic Technitium deployments
  hosts: arcane
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Pause automatic Technitium deployments
    ansible.builtin.import_role:
      name: arcane
      tasks_from: pause
    when: backup_scope | default('all') == 'all'
- name: Back up the application LXC to explicitly selected storage
  hosts: pve
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Back up the application LXC to explicitly selected storage
    ansible.builtin.import_role:
      name: proxmox
      tasks_from: backup_guest
    when: backup_scope | default('all') == 'all'
- name: Verify the application host and web services
  hosts: arcane
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Verify the application host and web services
    ansible.builtin.import_role:
      name: controller
      tasks_from: health
    when: backup_scope | default('all') == 'all'
- name: Verify DNS from the controller through the LAN
  hosts: arcane
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Verify DNS from the controller through the LAN
    ansible.builtin.import_role:
      name: technitium
      tasks_from: verify
    when:
    - backup_scope | default('all') == 'all'
    - manage_dns | default(false) | bool
- name: Release the lock after successful completion
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Release the lock after successful completion
    ansible.builtin.import_role:
      name: controller
      tasks_from: unlock
