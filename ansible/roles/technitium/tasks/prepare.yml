---
- name: Prepare persistent Technitium data and secret
  vars:
    controller_secret_dir: "{{ repo_root }}/secrets/technitium"
    controller_password_file: "{{ controller_secret_dir }}/technitium-admin-password"
  block:
  - name: Wait for the Podman LXC
    ansible.builtin.wait_for_connection:
      timeout: 60
  - name: Create controller secret directory
    ansible.builtin.file:
      path: "{{ controller_secret_dir }}"
      state: directory
      mode: '0700'
    delegate_to: localhost
  - name: Check for the controller password file
    ansible.builtin.stat:
      path: "{{ controller_password_file }}"
    delegate_to: localhost
    register: controller_password
  - name: Generate the initial Technitium admin password
    ansible.builtin.command: openssl rand -base64 24
    delegate_to: localhost
    register: generated_password
    changed_when: true
    when: not controller_password.stat.exists
    no_log: true
  - name: Save the Technitium password in the ignored secrets directory
    ansible.builtin.copy:
      dest: "{{ controller_password_file }}"
      content: |
        {{ generated_password.stdout }}
      mode: '0600'
    delegate_to: localhost
    when: not controller_password.stat.exists
    no_log: true
  - name: Read the Technitium admin password
    ansible.builtin.slurp:
      src: "{{ controller_password_file }}"
    delegate_to: localhost
    register: technitium_password
    no_log: true
  - name: Create Technitium directories
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: directory
      mode: "{{ item.mode }}"
    loop:
    - path: /etc/technitium
      mode: '0700'
    - path: /var/lib/technitium/config
      mode: '0750'
    - path: /var/lib/technitium/logs
      mode: '0750'
  - name: Install the initial admin password file
    ansible.builtin.copy:
      dest: /etc/technitium/admin-password
      content: |
        {{ technitium_password.content | b64decode | trim }}
      mode: '0600'
    no_log: true
