---
- name: Configure Technitium DNS
  vars:
    technitium_api: http://127.0.0.1:5380/api
    controller_password_file: "{{ repo_root }}/secrets/technitium/technitium-admin-password"
    technitium_block_lists:
    - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.plus.txt
    - https://hole.cert.pl/domains/v2/domains.txt
  block:
  - name: Wait for Technitium host
    ansible.builtin.wait_for_connection:
      timeout: 60
  - name: Wait for the Technitium API
    ansible.builtin.uri:
      url: http://127.0.0.1:5380/
      status_code: 200
    register: technitium_api_health
    retries: 30
    delay: 3
    until: technitium_api_health.status == 200
  - name: Read the Technitium admin password
    ansible.builtin.slurp:
      src: "{{ controller_password_file }}"
    delegate_to: localhost
    register: technitium_password_file
    no_log: true
  - name: Log in to the Technitium API
    ansible.builtin.uri:
      url: "{{ technitium_api }}/user/login"
      method: POST
      body_format: form-urlencoded
      body:
        user: admin
        pass: "{{ technitium_password_file.content | b64decode | trim }}"
      return_content: true
      status_code: 200
    register: technitium_login
    failed_when: technitium_login.json.status | default('error') != 'ok'
    no_log: true
  - name: Store the short-lived Technitium session token
    ansible.builtin.set_fact:
      technitium_token: "{{ technitium_login.json.token }}"
    no_log: true
  - name: Configure recursive DNS and blocking
    ansible.builtin.uri:
      url: "{{ technitium_api }}/settings/set"
      method: POST
      headers:
        Authorization: "Bearer {{ technitium_token }}"
      body_format: json
      body:
        dnsServerDomain: dns.home.arpa
        defaultRecordTtl: 300
        dnssecValidation: true
        eDnsClientSubnet: false
        recursion: UseSpecifiedNetworkACL
        recursionNetworkACL:
        - 127.0.0.0/8
        - 10.0.0.0/24
        - ::1
        randomizeName: true
        qnameMinimization: true
        locallyServedDnsZones: true
        saveCache: true
        serveStale: true
        serveStaleTtl: 259200
        serveStaleAnswerTtl: 30
        serveStaleResetTtl: 30
        serveStaleMaxWaitTime: 1800
        cacheMinimumRecordTtl: 10
        cacheMaximumRecordTtl: 86400
        cacheNegativeRecordTtl: 300
        cacheFailureRecordTtl: 10
        cachePrefetchEligibility: 2
        cachePrefetchTrigger: 9
        cachePrefetchSampleIntervalInMinutes: 5
        cachePrefetchSampleEligibilityHitsPerHour: 30
        enableBlocking: true
        allowTxtBlockingReport: true
        blockingType: NxDomain
        blockingAnswerTtl: 30
        blockListUrls: "{{ technitium_block_lists }}"
        blockListUpdateIntervalHours: 24
        forwarders: []
        loggingType: File
        logQueries: false
        ignoreResolverLogs: false
        useLocalTime: true
        maxLogFileDays: 30
        enableInMemoryStats: false
        maxStatFileDays: 30
      return_content: true
      status_code: 200
    register: technitium_settings
    no_log: true
  - name: Verify critical DNS settings
    ansible.builtin.assert:
      that:
      - technitium_settings.json.status == 'ok'
      - technitium_settings.json.response.dnssecValidation
      - technitium_settings.json.response.recursion == 'UseSpecifiedNetworkACL'
      - technitium_settings.json.response.forwarders is none or technitium_settings.json.response.forwarders | length
        == 0
      - technitium_settings.json.response.enableBlocking
      - (technitium_settings.json.response.blockListUrls | sort) == (technitium_block_lists | sort)
      fail_msg: Technitium did not retain the requested recursive DNS settings.
  - name: List authoritative zones
    ansible.builtin.uri:
      url: "{{ technitium_api }}/zones/list"
      headers:
        Authorization: "Bearer {{ technitium_token }}"
      return_content: true
      status_code: 200
    register: technitium_zones
    failed_when: technitium_zones.json.status | default('error') != 'ok'
    no_log: true
  - name: Create the home.arpa zone
    ansible.builtin.uri:
      url: "{{ technitium_api }}/zones/create"
      method: POST
      headers:
        Authorization: "Bearer {{ technitium_token }}"
      body_format: form-urlencoded
      body:
        zone: home.arpa
        type: Primary
        useSoaSerialDateScheme: true
      status_code: 200
    register: technitium_zone_created
    failed_when: technitium_zone_created.json.status | default('error') != 'ok'
    when: '''home.arpa'' not in (technitium_zones.json.response.zones | map(attribute=''name'') | list)'
    no_log: true
  - name: Reconcile home.arpa address records
    ansible.builtin.uri:
      url: "{{ technitium_api }}/zones/records/add"
      method: POST
      headers:
        Authorization: "Bearer {{ technitium_token }}"
      body_format: form-urlencoded
      body:
        domain: "{{ item.name }}"
        zone: home.arpa
        type: A
        ttl: 300
        overwrite: true
        ipAddress: "{{ item.address }}"
        ptr: "{{ item.ptr }}"
        createPtrZone: "{{ item.ptr }}"
        comments: Managed by Ansible
      status_code: 200
    loop: "{{ technitium_records }}"
    register: technitium_record_write
    failed_when: technitium_record_write.json.status | default('error') != 'ok'
    changed_when: true
    no_log: true
  - name: Download block lists now
    ansible.builtin.uri:
      url: "{{ technitium_api }}/settings/forceUpdateBlockLists"
      method: POST
      headers:
        Authorization: "Bearer {{ technitium_token }}"
      status_code: 200
      timeout: 900
    register: technitium_block_list_update
    failed_when: technitium_block_list_update.json.status | default('error') != 'ok'
    no_log: true
