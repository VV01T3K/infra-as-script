---
- ansible.builtin.assert:
    that: not ansible_check_mode
    fail_msg: Use syntax checks; check mode cannot validate operational gates.
- ansible.builtin.file:
    path: "{{ repo_root }}/secrets/proxmox"
    state: directory
    mode: '0700'
- name: Acquire the shared lock atomically
  ansible.builtin.command:
    argv:
    - mkdir
    - -m
    - '700'
    - "{{ repo_root }}/secrets/proxmox/maintenance.lock.d"
  changed_when: true
- name: Record lock ownership for recovery
  ansible.builtin.copy:
    dest: "{{ repo_root }}/secrets/proxmox/maintenance.lock.d/owner.txt"
    content: "Started {{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }} by {{ lookup('env', 'USER') }}"
    mode: '0600'
