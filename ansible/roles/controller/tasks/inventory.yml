---
- name: Read the applied guest from OpenTofu
  ansible.builtin.command:
    argv: [tofu, "-chdir={{ repo_root }}/opentofu/proxmox", output, -json, arcane]
  register: applied_guest_output
  changed_when: false
  check_mode: false
  no_log: true
- name: Decode applied guest state
  ansible.builtin.set_fact:
    applied_guest: "{{ applied_guest_output.stdout | from_json }}"
  no_log: true
- name: Require a valid guest identity from applied state
  ansible.builtin.assert:
    that:
      - applied_guest is mapping
      - applied_guest.ip is defined and applied_guest.ip is string
      - applied_guest.lxc_id is defined and applied_guest.lxc_id is integer
      - applied_guest.lxc_id >= 100
      - applied_guest.ip is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
    fail_msg: Applied guest state is invalid. Resolve OpenTofu state before deploying.
- name: Validate the IPv4 octets without accepting ambiguous addresses
  ansible.builtin.assert:
    that:
      - applied_guest.ip.split('.') | map('int') | max <= 255
      - applied_guest.ip.split('.') | map('int') | map('string') | join('.') == applied_guest.ip
    fail_msg: Applied guest address is not a valid IPv4 address.
- name: Add the applied guest to this run
  ansible.builtin.add_host:
    name: arcane
    ansible_host: "{{ applied_guest.ip }}"
    lxc_id: "{{ applied_guest.lxc_id }}"
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: "{{ repo_root }}/secrets/proxmox/proxmox_bootstrap"
    ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
