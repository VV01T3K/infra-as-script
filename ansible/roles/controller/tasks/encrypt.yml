---
- name: Require a backup destination and passphrase outside check mode
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - controller_backup_path is defined
      - backup_passphrase | default('') | length > 0
  no_log: true
- name: Encrypt and publish the controller backup
  ansible.builtin.command:
    argv: [bash, "{{ repo_root }}/scripts/backup-controller.sh", "{{ controller_backup_path }}"]
    stdin: "{{ backup_passphrase }}"
  no_log: true
  changed_when: true
