---
- name: Generate or rotate managed credentials
  vars:
    secret_operation: "{{ secrets_action | default('status') }}"
    selection: "{{ secrets_only | default('all') }}"
    arcane_api: http://127.0.0.1:3552/api
    technitium_api: http://127.0.0.1:5380/api
    github_repository: VV01T3K/infra-as-script
  block:
  - name: Generate missing local credentials for initial deployment
    ansible.builtin.include_tasks: generate.yml
    loop: "{{ local_credentials }}"
    loop_control:
      label: "{{ item.name }}"
    when:
    - secret_operation == 'generate'
    - selection == 'all' or selection == item.name
  - name: Rotate the Proxmox API token
    ansible.builtin.include_tasks: proxmox-api.yml
    vars:
      secret_name: proxmox-api
      current: "{{ secrets_root }}/proxmox/proxmox.env"
      pending: "{{ secrets_root }}/.pending/proxmox-api"
      credential_kind: issued
    when: secret_operation == 'rotate' and selection in ['all', 'proxmox-api']
  - name: Rotate the Arcane API key
    ansible.builtin.include_tasks: arcane-api.yml
    vars:
      secret_name: arcane-api
      current: "{{ secrets_root }}/arcane/arcane-api-key"
      pending: "{{ secrets_root }}/.pending/arcane-api"
      credential_kind: password
      credential_prefix: arc_sk_
    when: secret_operation == 'rotate' and selection in ['all', 'arcane-api']
  - name: Rotate the GitHub deploy key and its Arcane connection
    ansible.builtin.include_tasks: gitops.yml
    vars:
      secret_name: gitops
      current: "{{ secrets_root }}/arcane/arcane-gitops"
      pending: "{{ secrets_root }}/.pending/gitops"
      credential_kind: ssh
    when: secret_operation == 'rotate' and selection in ['all', 'gitops']
  - name: Rotate the live Technitium administrator password
    ansible.builtin.include_tasks: technitium.yml
    vars:
      secret_name: technitium
      current: "{{ secrets_root }}/technitium/technitium-admin-password"
      pending: "{{ secrets_root }}/.pending/technitium"
      credential_kind: password
    when: secret_operation == 'rotate' and selection in ['all', 'technitium']
  - name: Rotate root console passwords
    ansible.builtin.include_tasks: root.yml
    loop: "{{ rotation_hosts }}"
    loop_control:
      loop_var: root_host
    vars:
      secret_name: "root-{{ root_host }}"
      current: "{{ secrets_root }}/{{ 'proxmox' if root_host == 'pve' else 'arcane' }}/root-password"
      pending: "{{ secrets_root }}/.pending/root-{{ root_host }}"
      credential_kind: password
    when: run_rotation and selection in ['all', 'root']
  - name: Rotate SSH access after all other credentials
    ansible.builtin.include_tasks: ssh.yml
    vars:
      secret_name: ssh
      current: "{{ secrets_root }}/proxmox/proxmox_bootstrap"
      pending: "{{ secrets_root }}/.pending/ssh"
      credential_kind: ssh
    when: run_rotation and selection in ['all', 'ssh']
  - name: Read the installed identity after a complete live rotation
    ansible.builtin.command: cat /etc/machine-id
    delegate_to: pve
    register: rotated_machine
    changed_when: false
    when: secret_operation == 'rotate' and selection == 'all'
  - name: Record that this deployment has retired installer credentials
    ansible.builtin.copy:
      dest: "{{ secrets_root }}/proxmox/installed-machine-id"
      content: |
        {{ rotated_machine.stdout | trim }}
      mode: '0600'
    when: secret_operation == 'rotate' and selection == 'all'
  - name: Record successful retirement of the installer credentials
    ansible.builtin.copy:
      dest: "{{ secrets_root }}/proxmox/installed-machine-id"
      content: |
        {{ installed_machine.stdout | trim }}
      mode: '0600'
    when: secret_operation == 'post-install' and run_rotation
  - name: Explain generated values requiring server-side issuance
    ansible.builtin.debug:
      msg: Local values are ready. Host setup issues the Proxmox API token; post-install replaces root and SSH credentials.
        Generate is for initial setup, not recovery of missing live passwords.
    when: secret_operation == 'generate'
