---
- name: Prepare credential management
  vars:
    secret_operation: "{{ secrets_action | default('status') }}"
    selection: "{{ secrets_only | default('all') }}"
  block:
  - name: Validate the requested operation
    ansible.builtin.assert:
      that:
      - secret_operation in ['status', 'generate', 'rotate', 'post-install']
      - selection in ['all', 'root', 'ssh', 'proxmox-api', 'arcane-api', 'gitops', 'technitium']
      - not ansible_check_mode
      - secret_operation != 'generate' or selection not in ['root', 'proxmox-api']
      - secret_operation != 'post-install' or selection == 'all'
  - name: Set shared paths and policy
    ansible.builtin.set_fact:
      secrets_root: "{{ repo_root }}/secrets"
      rotation_hosts: "{{ ['pve'] if secret_operation == 'post-install' else ['pve', 'arcane'] }}"
      run_rotation: "{{ secret_operation == 'rotate' }}"
      local_credentials:
      - name: ssh
        path: proxmox/proxmox_bootstrap
        kind: ssh
      - name: arcane-api
        path: arcane/arcane-api-key
        kind: password
        prefix: arc_sk_
      - name: gitops
        path: arcane/arcane-gitops
        kind: ssh
      - name: technitium
        path: technitium/technitium-admin-password
        kind: password
  - name: Create private credential folders
    ansible.builtin.file:
      path: "{{ secrets_root }}/{{ item }}"
      state: directory
      mode: '0700'
    loop:
    - proxmox
    - arcane
    - technitium
    - .pending
    - history
    when: secret_operation != 'status'
  - name: Read installed host identity
    ansible.builtin.command: cat /etc/machine-id
    delegate_to: pve
    register: installed_machine
    changed_when: false
    when: secret_operation == 'post-install'
  - name: Retire installer credentials once per installed machine
    ansible.builtin.set_fact:
      run_rotation: "{{ lookup('file', secrets_root + '/proxmox/installed-machine-id', errors='ignore') | trim !=\
        \ installed_machine.stdout | trim }}"
    when: secret_operation == 'post-install'
  - name: Check whether guest infrastructure already exists locally
    ansible.builtin.stat:
      path: "{{ repo_root }}/opentofu/proxmox/terraform.tfstate"
    register: existing_guest_state
    when: secret_operation in ['post-install', 'generate']
  - name: Keep first-install SSH replacement before guest provisioning
    ansible.builtin.assert:
      that: not run_rotation or not existing_guest_state.stat.exists
      fail_msg: This existing deployment predates installer retirement. Run secrets.yml with secrets_action=rotate
        first so both host and guest receive the replacement SSH key.
    when: secret_operation == 'post-install'
  - name: Report local credential presence without showing values
    ansible.builtin.stat:
      path: "{{ secrets_root }}/{{ item }}"
    loop:
    - proxmox/proxmox_bootstrap
    - proxmox/proxmox.env
    - proxmox/root-password
    - arcane/arcane-api-key
    - arcane/arcane-gitops
    - arcane/root-password
    - technitium/technitium-admin-password
    register: secret_status
    when: secret_operation == 'status'
  - ansible.builtin.debug:
      msg: "{{ item.item }}: {{ 'present' if item.stat.exists else 'missing' }}"
    loop: "{{ secret_status.results | default([]) }}"
    loop_control:
      label: "{{ item.item }}"
    when: secret_operation == 'status'
