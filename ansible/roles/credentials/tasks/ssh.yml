---
- name: Start the installer public key list
  ansible.builtin.set_fact:
    installer_public_keys: []
- name: Read bootstrap public keys from completed installer profiles
  ansible.builtin.set_fact:
    installer_public_keys: "{{ installer_public_keys + ((lookup('file', item) | community.general.from_toml).get('global', {}).get('root-ssh-keys', [])) }}"
  loop: "{{ query('fileglob', repo_root + '/secrets/installer/*/answer.toml', repo_root + '/stages/01-install/profiles/*.toml') | reject('search', '\\.example\\.toml$') | list }}"
  no_log: true
- ansible.builtin.include_tasks: candidate.yml
- name: Require the old SSH key before changing access
  ansible.builtin.stat:
    path: "{{ pending }}/old"
  register: old_ssh_key
- ansible.builtin.assert:
    that: old_ssh_key.stat.exists
- name: Read the old public key
  ansible.builtin.command:
    argv:
    - ssh-keygen
    - -y
    - -f
    - "{{ pending }}/old"
  register: old_public
  changed_when: false
- name: Retain the installer key for future reinstalls
  ansible.builtin.copy:
    src: "{{ pending }}/old"
    dest: "{{ secrets_root }}/proxmox/installer.key"
    force: false
    mode: '0600'
  no_log: true
- name: Install the replacement key alongside the old key
  ansible.builtin.lineinfile:
    path: "{{ hostvars[item].rotation_authorized_keys | default('/root/.ssh/authorized_keys') }}"
    line: "{{ lookup('file', pending + '/new.pub') | trim }}"
    create: true
    mode: '0600'
  delegate_to: "{{ item }}"
  loop: "{{ rotation_hosts }}"
- name: Verify independent SSH authentication using only the replacement key
  ansible.builtin.command:
    argv:
    - ssh
    - -F
    - /dev/null
    - -o
    - BatchMode=yes
    - -o
    - IdentitiesOnly=yes
    - -o
    - IdentityAgent=none
    - -o
    - ControlMaster=no
    - -o
    - ControlPath=none
    - -o
    - StrictHostKeyChecking=yes
    - -o
    - ConnectTimeout=15
    - -i
    - "{{ pending }}/new"
    - "root@{{ hostvars[item].ansible_host }}"
    - 'true'
  loop: "{{ rotation_hosts }}"
  changed_when: false
- ansible.builtin.include_tasks: publish.yml
- name: Retire the prior managed key and installer bootstrap keys
  ansible.builtin.lineinfile:
    path: "{{ hostvars[item.0].rotation_authorized_keys | default('/root/.ssh/authorized_keys') }}"
    regexp: "^.*{{ item.1.split()[1] | regex_escape }}(?: .*)?$"
    state: absent
  delegate_to: "{{ item.0 }}"
  loop: "{{ rotation_hosts | product(([old_public.stdout] + installer_public_keys) | unique)\
    \ | list }}"
- ansible.builtin.include_tasks: finish.yml
