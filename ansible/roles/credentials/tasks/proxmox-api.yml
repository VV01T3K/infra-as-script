---
- ansible.builtin.include_tasks: candidate.yml
- name: Allocate a new token identity and keep it across retries
  ansible.builtin.set_fact:
    next_token_name: "iac-{{ lookup('password', pending + '/token-name length=12 chars=ascii_lowercase') }}"
  no_log: true
- name: Read server token identities
  ansible.builtin.command:
    argv:
    - pveum
    - user
    - token
    - list
    - automation@pve
    - --output-format
    - json
  delegate_to: pve
  register: server_tokens
  changed_when: false
- ansible.builtin.stat:
    path: "{{ pending }}/new"
  register: pending_token_file
- name: Remove an unpublished candidate whose one-time secret was lost
  ansible.builtin.command:
    argv:
    - pveum
    - user
    - token
    - remove
    - automation@pve
    - "{{ next_token_name }}"
  delegate_to: pve
  when:
  - not pending_token_file.stat.exists
  - next_token_name in (server_tokens.stdout | from_json | map(attribute='tokenid'))
  changed_when: true
- name: Issue the replacement token without revoking the current token
  ansible.builtin.command:
    argv:
    - pveum
    - user
    - token
    - add
    - automation@pve
    - "{{ next_token_name }}"
    - --privsep
    - '0'
    - --comment
    - Infrastructure automation
    - --output-format
    - json
  delegate_to: pve
  register: issued_token
  when: not pending_token_file.stat.exists
  no_log: true
  changed_when: true
- name: Persist the one-time token response immediately
  ansible.builtin.copy:
    dest: "{{ pending }}/new"
    mode: '0600'
    content: |
      export PROXMOX_VE_ENDPOINT='https://{{ hostvars['pve'].ansible_host }}:8006/'
      export PROXMOX_VE_API_TOKEN_ID='{{ (issued_token.stdout | from_json)['full-tokenid'] }}'
      export PROXMOX_VE_API_TOKEN_SECRET='{{ (issued_token.stdout | from_json).value }}'
      export PROXMOX_VE_API_TOKEN='{{ (issued_token.stdout | from_json)['full-tokenid'] }}={{ (issued_token.stdout | from_json).value }}'
  when: not pending_token_file.stat.exists
  no_log: true
- name: Read replacement token fields without executing the env file
  ansible.builtin.set_fact:
    new_token_full: "{{ (lookup('file', pending + '/new') | regex_findall(\"PROXMOX_VE_API_TOKEN='([^']+)'\"))[0]\
      \ }}"
  no_log: true
- name: Verify the replacement token on a protected API endpoint
  ansible.builtin.uri:
    url: "{{ proxmox_api_url | default('https://' + hostvars['pve'].ansible_host + ':8006/api2/json') }}/nodes"
    headers:
      Authorization: "PVEAPIToken={{ new_token_full }}"
    validate_certs: false
    status_code: 200
  no_log: true
- ansible.builtin.include_tasks: publish.yml
- name: Record the active identity for later host configuration runs
  ansible.builtin.copy:
    dest: "{{ secrets_root }}/proxmox/token-id"
    content: |
      {{ next_token_name }}
    mode: '0600'
- name: Retire the old managed token after publication
  ansible.builtin.command:
    argv:
    - pveum
    - user
    - token
    - remove
    - automation@pve
    - "{{ old_token_name }}"
  delegate_to: pve
  vars:
    old_token_name: "{{ ((lookup('file', pending + '/old', errors='ignore') | regex_findall(\"PROXMOX_VE_API_TOKEN_ID='automation@pve!([^']+)'\"\
      )) | first) | default('') }}"
  when:
  - old_token_name | length > 0
  - old_token_name != next_token_name
  - old_token_name in (server_tokens.stdout | from_json | map(attribute='tokenid'))
  changed_when: true
- ansible.builtin.include_tasks: finish.yml
