---
- name: Check a locally generated credential
  ansible.builtin.stat:
    path: "{{ secrets_root }}/{{ item.path }}"
  register: generated_file
- name: Create only missing values without replacing existing credentials
  when: not generated_file.stat.exists
  block:
  - name: Refuse to generate replacement files for an already provisioned deployment
    ansible.builtin.assert:
      that: not existing_guest_state.stat.exists
      fail_msg: Use rotate for live credentials, or restore missing local files from a backup.
  - name: Check the origin of any pending transaction
    ansible.builtin.assert:
      that: lookup('file', pending + '/operation', errors='ignore') | default('generate', true) == 'generate'
      fail_msg: This credential has a pending live rotation; resume that rotation instead.
  - ansible.builtin.include_tasks: candidate.yml
  - ansible.builtin.include_tasks: publish.yml
  - ansible.builtin.include_tasks: finish.yml
  vars:
    secret_name: "{{ item.name }}"
    current: "{{ secrets_root }}/{{ item.path }}"
    pending: "{{ secrets_root }}/.pending/{{ item.name }}"
    credential_kind: "{{ item.kind }}"
    credential_prefix: "{{ item.prefix | default('') }}"
