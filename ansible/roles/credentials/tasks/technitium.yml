---
- ansible.builtin.include_tasks: candidate.yml
- name: Try the saved candidate first so an interrupted password change can resume
  ansible.builtin.uri:
    url: "{{ technitium_api }}/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ lookup('file', pending + '/new') | trim }}"
      totp: "{{ technitium_totp | default(omit) }}"
    status_code: 200
  delegate_to: arcane
  register: candidate_login
  no_log: true
- name: Change the password using the current credential
  when: candidate_login.json.status | default('error') != 'ok'
  block:
  - name: Authenticate using the saved original password
    ansible.builtin.uri:
      url: "{{ technitium_api }}/user/login"
      method: POST
      body_format: form-urlencoded
      body:
        user: admin
        pass: "{{ lookup('file', pending + '/old') | trim }}"
        totp: "{{ technitium_totp | default(omit) }}"
    delegate_to: arcane
    register: old_login
    failed_when: old_login.json.status | default('error') != 'ok'
    no_log: true
  - name: Change the live password through the supported API
    ansible.builtin.uri:
      url: "{{ technitium_api }}/user/changePassword"
      method: POST
      headers:
        Authorization: "Bearer {{ old_login.json.token }}"
      body_format: form-urlencoded
      body:
        pass: "{{ lookup('file', pending + '/old') | trim }}"
        newPass: "{{ lookup('file', pending + '/new') | trim }}"
        totp: "{{ technitium_totp | default(omit) }}"
    delegate_to: arcane
    register: changed_password
    failed_when: changed_password.json.status | default('error') != 'ok'
    no_log: true
- name: Verify a fresh login with the replacement password
  ansible.builtin.uri:
    url: "{{ technitium_api }}/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ lookup('file', pending + '/new') | trim }}"
      totp: "{{ technitium_totp | default(omit) }}"
  delegate_to: arcane
  register: verified_login
  failed_when: verified_login.json.status | default('error') != 'ok'
  no_log: true
- name: Update the runtime bootstrap password file too
  ansible.builtin.copy:
    src: "{{ pending }}/new"
    dest: "{{ technitium_password_path | default('/etc/technitium/admin-password') }}"
    mode: '0600'
  delegate_to: arcane
  no_log: true
- ansible.builtin.include_tasks: publish.yml
- name: Read existing administrator sessions
  ansible.builtin.uri:
    url: "{{ technitium_api }}/user/profile/get"
    headers:
      Authorization: "Bearer {{ verified_login.json.token }}"
  delegate_to: arcane
  register: admin_profile
  failed_when: admin_profile.json.status | default('error') != 'ok'
  no_log: true
- name: Revoke previous sessions and tokens for the managed admin account
  ansible.builtin.uri:
    url: "{{ technitium_api }}/user/session/delete"
    method: POST
    headers:
      Authorization: "Bearer {{ verified_login.json.token }}"
    body_format: form-urlencoded
    body:
      partialToken: "{{ item.partialToken }}"
  delegate_to: arcane
  loop: "{{ admin_profile.json.response.sessions }}"
  when: not item.isCurrentSession
  register: retired_session
  failed_when: retired_session.json.status | default('error') != 'ok'
  no_log: true
- name: End the rotation session
  ansible.builtin.uri:
    url: "{{ technitium_api }}/user/logout"
    method: POST
    headers:
      Authorization: "Bearer {{ verified_login.json.token }}"
  delegate_to: arcane
  no_log: true
- ansible.builtin.include_tasks: finish.yml
