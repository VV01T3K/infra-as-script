---
- name: Wait for the guest
  ansible.builtin.wait_for_connection:
    timeout: 300
- name: Enable restart-policy containers at guest boot
  ansible.builtin.systemd_service:
    name: podman-restart.service
    enabled: true
    state: started
- name: Ensure Arcane is running
  ansible.builtin.systemd_service:
    name: arcane.service
    state: started
