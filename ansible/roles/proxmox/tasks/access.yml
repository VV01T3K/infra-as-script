---
- name: Configure Proxmox access and management firewall
  vars:
    automation_user: automation@pve
    automation_token: "{{ lookup('file', token_directory + '/token-id', errors='ignore') | default('iac', true)\
      \ | trim }}"
    management_network: 10.0.0.0/24
    token_directory: "{{ repo_root }}/secrets/proxmox"
    token_file: "{{ token_directory }}/proxmox.env"
  block:
  - name: Read Proxmox users
    ansible.builtin.command: pveum user list --output-format json
    changed_when: false
    register: pve_users
  - name: Create the automation user
    ansible.builtin.command:
      argv:
      - pveum
      - user
      - add
      - "{{ automation_user }}"
      - --comment
      - Infrastructure automation
      - --enable
      - '1'
    when: automation_user not in (pve_users.stdout | from_json | map(attribute='userid'))
  - name: Read Proxmox permissions
    ansible.builtin.command: pveum acl list --output-format json
    changed_when: false
    register: pve_acls
  - name: Grant the automation user PVEAdmin access
    ansible.builtin.command:
      argv:
      - pveum
      - acl
      - modify
      - /
      - --users
      - "{{ automation_user }}"
      - --roles
      - PVEAdmin
      - --propagate
      - '1'
    when: pve_acls.stdout | from_json | selectattr('ugid', 'equalto', automation_user) | selectattr('roleid', 'equalto',
      'PVEAdmin') | selectattr('path', 'equalto', '/') | list | length == 0
  - name: Read API tokens
    ansible.builtin.command: "pveum user token list {{ automation_user }} --output-format json"
    changed_when: false
    register: pve_tokens
  - name: Check for the controller token file
    ansible.builtin.stat:
      path: "{{ token_file }}"
    delegate_to: localhost
    register: controller_token_file
  - name: Refuse to lose an existing API token
    ansible.builtin.assert:
      that: controller_token_file.stat.exists
      fail_msg: "The API token exists on Proxmox, but {{ token_file }} is missing. Remove the token manually before\
        \ recreating it."
    when: automation_token in (pve_tokens.stdout | from_json | map(attribute='tokenid'))
  - name: Create the API token
    ansible.builtin.command:
      argv:
      - pveum
      - user
      - token
      - add
      - "{{ automation_user }}"
      - "{{ automation_token }}"
      - --comment
      - Infrastructure automation
      - --privsep
      - '0'
      - --output-format
      - json
    when: automation_token not in (pve_tokens.stdout | from_json | map(attribute='tokenid'))
    register: created_token
    no_log: true
  - name: Create the controller secret directory
    ansible.builtin.file:
      path: "{{ token_directory }}"
      state: directory
      mode: '0700'
    delegate_to: localhost
  - name: Save the API token in the ignored secrets directory
    ansible.builtin.copy:
      dest: "{{ token_file }}"
      mode: '0600'
      content: |
        export PROXMOX_VE_ENDPOINT='https://10.0.0.50:8006/'
        export PROXMOX_VE_API_TOKEN_ID='{{ (created_token.stdout | from_json)['full-tokenid'] }}'
        export PROXMOX_VE_API_TOKEN_SECRET='{{ (created_token.stdout | from_json).value }}'
        export PROXMOX_VE_API_TOKEN='{{ (created_token.stdout | from_json)['full-tokenid'] }}={{ (created_token.stdout | from_json).value }}'
    delegate_to: localhost
    when: created_token is changed
    no_log: true
  - name: Verify the new API token
    ansible.builtin.uri:
      url: https://10.0.0.50:8006/api2/json/version
      headers:
        Authorization: "PVEAPIToken={{ (created_token.stdout | from_json)['full-tokenid'] }}={{ (created_token.stdout\
          \ | from_json).value }}"
      validate_certs: false
      status_code: 200
    delegate_to: localhost
    when: created_token is changed
    no_log: true
  - name: Read host firewall rules
    ansible.builtin.command: pvesh get /nodes/pve/firewall/rules --output-format json
    changed_when: false
    register: host_firewall_rules
  - name: Allow management traffic from the home LAN
    ansible.builtin.command:
      argv:
      - pvesh
      - create
      - /nodes/pve/firewall/rules
      - --type
      - in
      - --action
      - ACCEPT
      - --source
      - "{{ management_network }}"
      - --enable
      - '1'
      - --comment
      - Ansible management LAN
    when: host_firewall_rules.stdout | from_json | selectattr('comment', 'defined') | selectattr('comment', 'equalto',
      'Ansible management LAN') | list | length == 0
  - name: Enable host firewall rules
    ansible.builtin.command: pvesh set /nodes/pve/firewall/options --enable 1
    changed_when: false
  - name: Configure cluster firewall policy while preserving its rules
    ansible.builtin.command: pvesh set /cluster/firewall/options --policy_in DROP --policy_out ACCEPT --policy_forward
      ACCEPT
    changed_when: false
  - name: Validate the firewall configuration
    ansible.builtin.command: pve-firewall compile
    changed_when: false
  - name: Read the cluster firewall configuration
    ansible.builtin.slurp:
      src: /etc/pve/firewall/cluster.fw
    register: cluster_firewall
  - name: Schedule an automatic firewall rollback
    ansible.builtin.command:
      argv:
      - systemd-run
      - --unit=pve-firewall-rollback
      - --on-active=2m
      - /usr/sbin/pve-firewall
      - stop
    when: '''enable: 1'' not in (cluster_firewall.content | b64decode)'
    changed_when: true
  - name: Enable the firewall cluster-wide
    ansible.builtin.command: pvesh set /cluster/firewall/options --enable 1
    when: '''enable: 1'' not in (cluster_firewall.content | b64decode)'
    changed_when: true
  - name: Verify a new SSH connection through the firewall
    ansible.builtin.wait_for:
      host: 10.0.0.50
      port: 22
      timeout: 30
    delegate_to: localhost
  - name: Verify a new web connection through the firewall
    ansible.builtin.uri:
      url: https://10.0.0.50:8006/api2/json/version
      validate_certs: false
      status_code:
      - 200
      - 401
    delegate_to: localhost
  - name: Cancel the firewall rollback
    ansible.builtin.systemd_service:
      name: pve-firewall-rollback.timer
      state: stopped
    when: '''enable: 1'' not in (cluster_firewall.content | b64decode)'
  - name: Read firewall status
    ansible.builtin.command: pve-firewall status
    changed_when: false
    register: firewall_status
    failed_when: '''enabled/running'' not in firewall_status.stdout'
  - name: Report access configuration
    ansible.builtin.debug:
      msg:
      - "API identity: {{ automation_user }}!{{ automation_token }}"
      - "API secret file: {{ token_file }}"
      - "Firewall: {{ firewall_status.stdout }}"
