---
- name: Configure Arcane on Podman
  vars:
    arcane_image: ghcr.io/getarcaneapp/manager:v2.10.1
    arcane_url: "http://{{ ansible_host }}:3552"
    controller_secret_dir: "{{ repo_root }}/secrets/arcane"
    controller_api_key_file: "{{ controller_secret_dir }}/arcane-api-key"
    rotate_arcane_api_key: false
  block:
  - name: Wait for the new LXC to accept SSH
    ansible.builtin.wait_for_connection:
      delay: 2
      timeout: 180
  - name: Gather facts
    ansible.builtin.setup: null
  - name: Install Podman
    ansible.builtin.apt:
      name:
      - ca-certificates
      - podman
      state: present
      update_cache: true
      cache_valid_time: 3600
  - name: Check whether the root runtime directory is persistent
    ansible.builtin.stat:
      path: /var/lib/systemd/linger/root
    register: root_linger
  - name: Keep Podman's root runtime directory across sessions
    ansible.builtin.command: loginctl enable-linger root
    changed_when: true
    when: not root_linger.stat.exists
  - name: Use the reliable VFS storage driver inside unprivileged LXC
    ansible.builtin.copy:
      dest: /etc/containers/storage.conf
      mode: '0644'
      content: |
        [storage]
        driver = "vfs"
        runroot = "/run/containers/storage"
        graphroot = "/var/lib/containers/storage"
  - name: Enable the rootful Podman API socket
    ansible.builtin.systemd_service:
      name: podman.socket
      enabled: true
      state: started
  - name: Restart Compose containers according to their policies after boot
    ansible.builtin.import_tasks: podman_boot.yml
  - name: Create Arcane configuration directory
    ansible.builtin.file:
      path: /etc/arcane
      state: directory
      mode: '0700'
  - name: Create controller secret directory
    ansible.builtin.file:
      path: "{{ controller_secret_dir }}"
      state: directory
      mode: '0700'
    delegate_to: localhost
  - name: Check for a controller Arcane API key
    ansible.builtin.stat:
      path: "{{ controller_api_key_file }}"
    delegate_to: localhost
    register: controller_api_key
  - name: Generate the Arcane automation API key
    ansible.builtin.command: openssl rand -hex 32
    delegate_to: localhost
    register: generated_api_key
    changed_when: true
    when: rotate_arcane_api_key | bool or not controller_api_key.stat.exists
    no_log: true
  - name: Save the Arcane API key in the ignored secrets directory
    ansible.builtin.copy:
      dest: "{{ controller_api_key_file }}"
      content: |
        arc_sk_{{ generated_api_key.stdout }}
      mode: '0600'
    delegate_to: localhost
    when: rotate_arcane_api_key | bool or not controller_api_key.stat.exists
    no_log: true
  - name: Read the Arcane API key
    ansible.builtin.slurp:
      src: "{{ controller_api_key_file }}"
    delegate_to: localhost
    register: arcane_api_key
    no_log: true
  - name: Check for an existing Arcane secret
    ansible.builtin.stat:
      path: /etc/arcane/arcane.env
    register: arcane_env
  - name: Generate the Arcane encryption key
    ansible.builtin.command: openssl rand -hex 32
    register: arcane_key
    changed_when: true
    when: not arcane_env.stat.exists
    no_log: true
  - name: Save the Arcane environment
    ansible.builtin.copy:
      dest: /etc/arcane/arcane.env
      mode: '0600'
      content: |
        APP_URL={{ arcane_url }}
        TZ=Europe/Warsaw
        PUID=0
        PGID=0
        ENCRYPTION_KEY={{ arcane_key.stdout }}
    when: not arcane_env.stat.exists
    no_log: true
  - name: Reconcile the Arcane public URL
    ansible.builtin.lineinfile:
      path: /etc/arcane/arcane.env
      regexp: ^APP_URL=
      line: "APP_URL={{ arcane_url }}"
      mode: '0600'
    register: arcane_url_line
    no_log: true
  - name: Configure the static Arcane automation API key
    ansible.builtin.lineinfile:
      path: /etc/arcane/arcane.env
      regexp: ^ADMIN_STATIC_API_KEY=
      line: "ADMIN_STATIC_API_KEY={{ arcane_api_key.content | b64decode | trim }}"
      mode: '0600'
    register: arcane_api_key_line
    no_log: true
  - name: Create persistent Arcane data directory
    ansible.builtin.file:
      path: /var/lib/arcane
      state: directory
      mode: '0700'
  - name: Create the Arcane Quadlet
    ansible.builtin.copy:
      dest: /etc/containers/systemd/arcane.container
      mode: '0644'
      content: |
        [Unit]
        Description=Arcane container management panel
        Wants=network-online.target
        After=network-online.target podman.socket
        Requires=podman.socket

        [Container]
        Image={{ arcane_image }}
        ContainerName=arcane
        PublishPort=3552:3552
        Volume=/run/podman/podman.sock:/var/run/docker.sock
        Volume=/var/lib/arcane:/app/data
        Volume=/sys/fs/cgroup:/sys/fs/cgroup:ro
        EnvironmentFile=/etc/arcane/arcane.env
        SecurityLabelDisable=true
        PodmanArgs=--cgroupns=host

        [Service]
        Restart=always
        TimeoutStartSec=900

        [Install]
        WantedBy=multi-user.target
    register: arcane_quadlet
  - name: Reload systemd for the Arcane Quadlet
    ansible.builtin.systemd_service:
      daemon_reload: true
  - name: Start Arcane
    ansible.builtin.systemd_service:
      name: arcane.service
      enabled: true
      state: "{{ 'restarted' if (arcane_quadlet.changed or arcane_api_key_line.changed or arcane_url_line.changed)\
        \ else 'started' }}"
  - name: Wait for Arcane health endpoint
    ansible.builtin.uri:
      url: http://127.0.0.1:3552/api/health
      status_code: 200
    register: arcane_health
    retries: 30
    delay: 3
    until: arcane_health.status == 200
  - name: Check that Docker is absent
    ansible.builtin.command: docker --version
    changed_when: false
    failed_when: false
    register: docker_check
  - name: Verify this is a Podman-only host
    ansible.builtin.assert:
      that: docker_check.rc != 0
      fail_msg: Docker is installed unexpectedly.
      success_msg: "Arcane is healthy at {{ arcane_url }} and Docker is absent."
