- name: Read original container environments privately
  ansible.builtin.command:
    argv: [pct, exec, '301', '--', docker, inspect, researchcruiseapp-db, researchcruiseapp-backend, researchcruiseapp-frontend]
  delegate_to: torus
  register: originals
  changed_when: false
  no_log: true

- name: Read baked backend settings privately
  ansible.builtin.command:
    argv: [pct, exec, '301', '--', docker, exec, researchcruiseapp-backend, cat, /app/appsettings.json]
  delegate_to: torus
  register: appsettings
  changed_when: false
  no_log: true

- name: Preserve the live credentials and telemetry settings in memory
  ansible.builtin.set_fact:
    service_secrets: >-
      {{ lookup('ansible.builtin.env', 'SERVICE_SECRETS') | from_json | combine({'cruise_db_password': db.SA_PASSWORD,
      'cruise_db_connection_string': backend.ConnectionStrings__Database,
      'cruise_smtp_username': backend.SmtpSettings__SmtpUsername,
      'cruise_smtp_password': backend.SmtpSettings__SmtpPassword,
      'cruise_jwt_secret': backend.JWT__Secret | default((appsettings.stdout | from_json).JWT.Secret),
      'cruise_sentry_dsn_backend': backend.Sentry__Dsn | default(''),
      'cruise_sentry_dsn_frontend': frontend.SENTRY_DSN | default(''),
      'cruise_sentry_traces_sample_rate': backend.Sentry__TracesSampleRate | default('1'),
      'cruise_sentry_replays_session_sample_rate': frontend.SENTRY_REPLAYS_SESSION_SAMPLE_RATE | default('1')}) }}
  vars:
    db: "{{ dict((originals.stdout | from_json)[0].Config.Env | map('split', '=', 1)) }}"
    backend: "{{ dict((originals.stdout | from_json)[1].Config.Env | map('split', '=', 1)) }}"
    frontend: "{{ dict((originals.stdout | from_json)[2].Config.Env | map('split', '=', 1)) }}"
  no_log: true

- name: Save the credentials encrypted
  ansible.builtin.include_tasks: ../stages/5-services/tasks/save-secrets.yml
