---
- name: Upgrade packages within the installed Debian release
  hosts: "{{ update_target | default('arcane') }}"
  gather_facts: true
  pre_tasks:
    - name: Limit maintenance to supported hosts and Debian 13
      ansible.builtin.assert:
        that:
          - inventory_hostname in ['pve', 'arcane']
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
        fail_msg: This workflow supports routine Debian 13 updates, not major release upgrades.

    - name: Check the Proxmox major version
      ansible.builtin.command: pveversion
      register: maintenance_pve_version
      changed_when: false
      failed_when: "not maintenance_pve_version.stdout.startswith('pve-manager/9.')"
      when: inventory_hostname == 'pve'

  tasks:
    - name: Refresh package metadata
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 120

    - name: Upgrade packages without removing installed packages
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true
        fail_on_autoremove: true
        lock_timeout: 120
      register: package_update

    - name: Check for a pending reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: pending_reboot

    - name: Reboot after package changes to load updated libraries and services
      ansible.builtin.reboot:
        reboot_timeout: 600
        post_reboot_delay: 10
      when: package_update.changed or pending_reboot.stat.exists

- name: Restore guest container startup after a package update
  hosts: arcane
  gather_facts: false
  tasks:
    - name: Wait for the guest
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Enable restart-policy containers at guest boot
      ansible.builtin.systemd_service:
        name: podman-restart.service
        enabled: true
        state: started

    - name: Ensure Arcane is running
      ansible.builtin.systemd_service:
        name: arcane.service
        state: started
