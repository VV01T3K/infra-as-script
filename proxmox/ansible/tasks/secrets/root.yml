---
- ansible.builtin.include_tasks: candidate.yml
- name: Preserve the previous root password hash
  ansible.builtin.command: getent shadow root
  delegate_to: "{{ root_host }}"
  register: previous_shadow
  changed_when: false
  no_log: true
- ansible.builtin.copy:
    dest: "{{ pending }}/old-shadow"
    content: "{{ previous_shadow.stdout }}\n"
    force: false
    mode: '0600'
  no_log: true
- name: Hash the replacement root password
  ansible.builtin.command:
    argv: [openssl, passwd, -6, -stdin]
    stdin: "{{ lookup('file', pending + '/new') | trim }}"
  register: root_hash
  changed_when: false
  no_log: true
- name: Replace the installed root password
  ansible.builtin.user:
    name: root
    password: "{{ root_hash.stdout }}"
    update_password: always
  delegate_to: "{{ root_host }}"
  no_log: true
- name: Verify the installed hash
  ansible.builtin.command: getent shadow root
  delegate_to: "{{ root_host }}"
  register: installed_shadow
  failed_when: installed_shadow.stdout.split(':')[1] != root_hash.stdout
  changed_when: false
  no_log: true
- ansible.builtin.include_tasks: publish.yml
- ansible.builtin.include_tasks: finish.yml
