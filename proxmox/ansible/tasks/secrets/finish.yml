---
- name: Allocate a private recovery history directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ secrets_root }}/history"
    prefix: "{{ secret_name }}-"
  register: history_slot
- name: Archive the completed rotation
  ansible.builtin.command:
    argv: [mv, --, "{{ pending }}", "{{ history_slot.path }}/completed"]
  changed_when: true
