---
- name: Publish the verified credential
  ansible.builtin.copy:
    src: "{{ pending }}/new"
    dest: "{{ current }}"
    mode: '0600'
  no_log: true
- name: Publish its public key
  ansible.builtin.copy:
    src: "{{ pending }}/new.pub"
    dest: "{{ current }}.pub"
    mode: '0644'
  when: credential_kind == 'ssh'
