---
- ansible.builtin.include_tasks: candidate.yml
- name: Require GitHub administrator access
  ansible.builtin.command: gh auth status --hostname github.com
  changed_when: false
- name: Read the old deploy public key
  ansible.builtin.command:
    argv: [ssh-keygen, -y, -f, "{{ pending }}/old"]
  register: old_deploy_public
  changed_when: false
- name: Read current GitHub deploy keys
  ansible.builtin.command:
    argv: [gh, api, "repos/{{ github_repository }}/keys", --paginate, --slurp]
  register: github_keys
  changed_when: false
- name: Select the candidate's GitHub key
  ansible.builtin.set_fact:
    candidate_github_keys: "{{ github_keys.stdout | from_json | flatten | selectattr('key', 'equalto', lookup('file', pending + '/new.pub').split()[:2] | join(' ')) | list }}"
- name: Require read-only access for any already-registered candidate
  ansible.builtin.assert:
    that: candidate_github_keys | length == 0 or candidate_github_keys[0].read_only
- name: Register the replacement key without revoking the old one
  ansible.builtin.command:
    argv: [gh, repo, deploy-key, add, "{{ pending }}/new.pub", --repo, "{{ github_repository }}", --title, arcane-gitops]
  when: candidate_github_keys | length == 0
  changed_when: true
- name: Find Arcane's repository connection
  ansible.builtin.uri:
    url: "{{ arcane_api }}/customize/git-repositories?search=infra-as-script&start=0&limit=100"
    headers:
      X-Api-Key: "{{ lookup('file', secrets_root + '/arcane/arcane-api-key') | trim }}"
  delegate_to: arcane
  register: arcane_repositories
  no_log: true
- ansible.builtin.set_fact:
    managed_repositories: "{{ arcane_repositories.json.data | selectattr('url', 'equalto', 'git@github.com:' + github_repository + '.git') | list }}"
  no_log: true
- ansible.builtin.assert:
    that: managed_repositories | length == 1
- name: Install the new key in Arcane without redeploying any application
  ansible.builtin.uri:
    url: "{{ arcane_api }}/customize/git-repositories/{{ managed_repositories[0].id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ lookup('file', secrets_root + '/arcane/arcane-api-key') | trim }}"
    body_format: json
    body:
      name: "{{ managed_repositories[0].name }}"
      url: "git@github.com:{{ github_repository }}.git"
      authType: ssh
      sshKey: "{{ lookup('file', pending + '/new') }}"
      sshHostKeyVerification: accept_new
      enabled: true
    status_code: 200
  delegate_to: arcane
  no_log: true
- name: Verify Arcane can read Git using the new key
  ansible.builtin.uri:
    url: "{{ arcane_api }}/customize/git-repositories/{{ managed_repositories[0].id }}/test?branch=main"
    method: POST
    headers:
      X-Api-Key: "{{ lookup('file', secrets_root + '/arcane/arcane-api-key') | trim }}"
    status_code: 200
  delegate_to: arcane
  no_log: true
- ansible.builtin.include_tasks: publish.yml
- name: Revoke only GitHub keys matching the old public key
  ansible.builtin.command:
    argv: [gh, api, --method, DELETE, "repos/{{ github_repository }}/keys/{{ item.id }}"]
  loop: "{{ github_keys.stdout | from_json | flatten | selectattr('key', 'equalto', old_deploy_public.stdout.split()[:2] | join(' ')) | list }}"
  changed_when: true
- ansible.builtin.include_tasks: finish.yml
