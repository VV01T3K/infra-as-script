---
- name: Create private rotation staging
  ansible.builtin.file:
    path: "{{ pending }}"
    state: directory
    mode: '0700'
- name: Check whether this rotation already preserved its original state
  ansible.builtin.stat:
    path: "{{ pending }}/operation"
  register: staged_operation
- name: Check current credential
  ansible.builtin.stat:
    path: "{{ current }}"
  register: current_secret
- name: Preserve the original credential once for recovery
  ansible.builtin.copy:
    src: "{{ current }}"
    dest: "{{ pending }}/old"
    force: false
    mode: '0600'
  when: current_secret.stat.exists and not staged_operation.stat.exists
  no_log: true
- name: Record the operation without overwriting a pending transaction
  ansible.builtin.copy:
    dest: "{{ pending }}/operation"
    content: "{{ secrets_action | default('rotate') }}"
    force: false
    mode: '0600'
- name: Check for a preserved original credential
  ansible.builtin.stat:
    path: "{{ pending }}/old"
  register: preserved_original
- name: Generate a replacement SSH key once
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, '', -C, infra-as-script, -f, "{{ pending }}/new"]
    creates: "{{ pending }}/new"
  when: credential_kind == 'ssh'
  no_log: true
- name: Generate a replacement password once
  ansible.builtin.copy:
    dest: "{{ pending }}/new"
    content: "{{ credential_prefix | default('') }}{{ lookup('password', pending + '/random length=48 chars=ascii_letters,digits') }}\n"
    force: false
    mode: '0600'
  when: credential_kind == 'password'
  no_log: true
