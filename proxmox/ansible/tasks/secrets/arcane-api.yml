---
- ansible.builtin.include_tasks: candidate.yml
- name: Preserve the runtime environment including the database encryption key
  ansible.builtin.slurp:
    src: "{{ arcane_env_file | default('/etc/arcane/arcane.env') }}"
  delegate_to: arcane
  register: runtime_env
  no_log: true
- ansible.builtin.copy:
    dest: "{{ pending }}/runtime.env"
    content: "{{ runtime_env.content | b64decode }}"
    force: false
    mode: '0600'
  no_log: true
- name: Install and verify the replacement Arcane API key
  block:
    - ansible.builtin.lineinfile:
        path: "{{ arcane_env_file | default('/etc/arcane/arcane.env') }}"
        regexp: '^ADMIN_STATIC_API_KEY='
        line: "ADMIN_STATIC_API_KEY={{ lookup('file', pending + '/new') | trim }}"
        mode: '0600'
      delegate_to: arcane
      no_log: true
    - ansible.builtin.systemd_service:
        name: arcane.service
        state: restarted
      delegate_to: arcane
    - name: Verify an authenticated request with the replacement key
      ansible.builtin.uri:
        url: "{{ arcane_api }}/customize/git-repositories?start=0&limit=100"
        headers:
          X-Api-Key: "{{ lookup('file', pending + '/new') | trim }}"
        status_code: 200
      delegate_to: arcane
      register: new_arcane_auth
      retries: 30
      delay: 3
      until: new_arcane_auth.status == 200
      no_log: true
  rescue:
    - name: Restore the prior runtime environment after verification failure
      ansible.builtin.copy:
        src: "{{ pending }}/runtime.env"
        dest: "{{ arcane_env_file | default('/etc/arcane/arcane.env') }}"
        mode: '0600'
      delegate_to: arcane
      no_log: true
    - ansible.builtin.systemd_service:
        name: arcane.service
        state: restarted
      delegate_to: arcane
    - ansible.builtin.fail:
        msg: Arcane rejected the replacement key; restored its prior environment. Pending credentials were retained.
- ansible.builtin.include_tasks: publish.yml
- name: Verify the old API key no longer authenticates
  ansible.builtin.uri:
    url: "{{ arcane_api }}/customize/git-repositories?start=0&limit=100"
    headers:
      X-Api-Key: "{{ lookup('file', pending + '/old') | trim }}"
    status_code: [401, 403]
  delegate_to: arcane
  when: preserved_original.stat.exists
  no_log: true
- ansible.builtin.include_tasks: finish.yml
