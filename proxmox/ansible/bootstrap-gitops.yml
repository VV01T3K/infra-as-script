---
- name: Prepare the Arcane read-only GitHub deploy key
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    repository: VV01T3K/infra-as-script
    secret_dir: "{{ playbook_dir }}/../../secrets/arcane"
    key_file: "{{ secret_dir }}/arcane-gitops"
  tasks:
    - ansible.builtin.command: gh auth status --hostname github.com
      changed_when: false
    - name: Read repository visibility
      ansible.builtin.command:
        argv: [gh, repo, view, "{{ repository }}", --json, isPrivate]
      register: github_visibility
      changed_when: false
    - ansible.builtin.assert:
        that: (github_visibility.stdout | from_json).isPrivate
    - ansible.builtin.file:
        path: "{{ secret_dir }}"
        state: directory
        mode: '0700'
    - name: Generate the deploy key once
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, '', -C, arcane-gitops, -f, "{{ key_file }}"]
        creates: "{{ key_file }}"
    - ansible.builtin.file:
        path: "{{ key_file }}"
        mode: '0600'
    - name: Derive the public half from the private key
      ansible.builtin.command:
        argv: [ssh-keygen, -y, -f, "{{ key_file }}"]
      register: public_key
      changed_when: false
    - ansible.builtin.copy:
        dest: "{{ key_file }}.pub"
        content: "{{ public_key.stdout }}\n"
        mode: '0644'
    - name: Read registered repository keys
      ansible.builtin.command:
        argv: [gh, api, "repos/{{ repository }}/keys", --paginate, --slurp]
      register: github_keys
      changed_when: false
    - ansible.builtin.set_fact:
        matching_keys: "{{ github_keys.stdout | from_json | flatten | selectattr('title', 'equalto', 'arcane-gitops') | list }}"
    - name: Refuse a conflicting key or write access
      ansible.builtin.assert:
        that:
          - matching_keys | length <= 1
          - matching_keys | length == 0 or matching_keys[0].key == public_key.stdout
          - matching_keys | length == 0 or matching_keys[0].read_only
    - name: Register the public key with read-only access
      ansible.builtin.command:
        argv: [gh, repo, deploy-key, add, "{{ key_file }}.pub", --repo, "{{ repository }}", --title, arcane-gitops]
      when: matching_keys | length == 0
      changed_when: true
