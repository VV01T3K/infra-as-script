---
- name: Verify freshly installed Proxmox
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Read Proxmox version
      ansible.builtin.command: pveversion
      register: pve_version
      changed_when: false

    - name: Wait for the Proxmox API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8006
        timeout: 120

    - name: Query the Proxmox API
      ansible.builtin.uri:
        url: https://127.0.0.1:8006/api2/json/version
        validate_certs: false
        status_code: [200, 401]
      register: pve_api

    - name: Report readiness
      ansible.builtin.debug:
        msg:
          - "{{ pve_version.stdout }}"
          - "Proxmox API is responding (HTTP {{ pve_api.status }})"
