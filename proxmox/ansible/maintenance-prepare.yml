---
- name: Validate maintenance inputs and record this run
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars_prompt:
    - name: backup_passphrase
      prompt: Backup encryption passphrase (retain it for recovery)
      private: true
      confirm: true
  tasks:
    - ansible.builtin.assert:
        that:
          - maintenance_target | default('') in ['host', 'guest', 'arcane', 'technitium']
          - backup_storage | default('') | length > 0
          - controller_backup_dir | default('') is abs
          - backup_passphrase | length > 0
      no_log: true
    - ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/..", rev-parse, --show-toplevel]
      register: repository_root
      changed_when: false
    - ansible.builtin.command:
        argv: [realpath, -e, "{{ controller_backup_dir }}"]
      register: resolved_backup_dir
      changed_when: false
    - ansible.builtin.stat:
        path: "{{ resolved_backup_dir.stdout }}"
      register: backup_directory
    - name: Require an existing backup directory outside the repository
      ansible.builtin.assert:
        that:
          - backup_directory.stat.isdir | default(false)
          - resolved_backup_dir.stdout != repository_root.stdout
          - not resolved_backup_dir.stdout.startswith(repository_root.stdout + '/')
    - ansible.builtin.command:
        argv: [git, -C, "{{ repository_root.stdout }}", status, --porcelain]
      register: checkout_changes
      changed_when: false
    - name: Require a clean committed checkout
      ansible.builtin.assert:
        that: checkout_changes.stdout | length == 0
    - ansible.builtin.command:
        argv: [git, -C, "{{ repository_root.stdout }}", rev-parse, HEAD]
      register: checkout_revision
      changed_when: false
    - ansible.builtin.command:
        argv: [git, ls-remote, git@github.com:VV01T3K/infra-as-script.git, refs/heads/main]
      register: published_revision
      changed_when: false
      when: maintenance_target == 'technitium'
    - name: Require the published revision to match
      ansible.builtin.assert:
        that: published_revision.stdout.split()[0] == checkout_revision.stdout
      when: maintenance_target == 'technitium'
    - ansible.builtin.tempfile:
        state: directory
        path: "{{ resolved_backup_dir.stdout }}"
        prefix: "update-{{ maintenance_target }}-"
      register: maintenance_run
    - name: Retain shared run values for subsequent plays
      ansible.builtin.set_fact:
        run_dir: "{{ maintenance_run.path }}"
        expected_revision: "{{ checkout_revision.stdout }}"
        encryption_passphrase: "{{ backup_passphrase }}"
      no_log: true
    - ansible.builtin.copy:
        dest: "{{ run_dir }}/manifest.txt"
        content: |
          target={{ maintenance_target }}
          revision={{ expected_revision }}
          backup_storage={{ backup_storage }}
        mode: '0600'
