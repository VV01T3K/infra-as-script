# Ansible settings for this repo. Run every command from the repo root.
[defaults]
inventory = inventory/hosts.yml
collections_path = .collections
interpreter_python = auto_silent

[ssh_connection]
# Reuse one SSH connection per machine during a run. Repo commands close it when they end.
control_path = ~/.ansible/cp/%%h-%%p-%%r
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
