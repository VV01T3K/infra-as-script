# Ansible settings for this repo. Run every command from the repo root.
[defaults]
inventory = inventory/hosts.yml
collections_path = .collections
interpreter_python = auto_silent

[ssh_connection]
# Reuse one SSH connection per machine for 15 minutes, so a YubiKey touch is needed once per machine.
control_path = ~/.ansible/cp/%%h-%%p-%%r
ssh_args = -o ControlMaster=auto -o ControlPersist=15m
