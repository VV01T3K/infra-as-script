# Ansible settings for this repo. Run every command from the repo root.
[defaults]
inventory = inventory/hosts.yml
collections_path = .collections
interpreter_python = auto_silent


# The connection to guests (stage 4 on) uses paramiko: only the fleet key from the temporary agent,
# never key files from ~/.ssh, and never saving host keys by itself (stage 4 copies them from
# secrets/known_hosts to ~/.ssh/known_hosts, the only file paramiko reads).
[paramiko_connection]
look_for_keys = False
host_key_auto_add = False
record_host_keys = False

# Retry messages ("FAILED - RETRYING") use the debug colour, dark gray by default, which some
# terminal themes make invisible. "normal" = the terminal's own text colour.
[colors]
debug = normal
