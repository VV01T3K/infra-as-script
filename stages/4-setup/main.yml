# Stage 4: from "an empty Alpine guest" to "a guest ready for containers": Python, updates, Docker
# (with memory accounting for its containers). Debian guests and VMs: updates.
# Run: mise run setup   (one guest or VM only: mise run setup dns1)
# Needs: stage 3 done (the guest exists and runs). Safe to re-run: every step checks first.
# Ansible reaches each guest through its Proxmox machine (pct exec), see "guests" in inventory/hosts.yml.

- name: Trust the Proxmox machines for the connection to guests
  hosts: proxmox
  connection: local # everything in this play happens on your computer
  gather_facts: false
  vars:
    # Use this computer's Python; otherwise Ansible remembers it as the machine's Python.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    repo: "{{ playbook_dir | dirname | dirname }}"
  tasks:
    # paramiko reads only ~/.ssh/known_hosts. The keys come from the repo's own copy, so a reinstalled
    # machine's new key replaces the old one here too.
    - name: Copy the machine's SSH host key from secrets/known_hosts to ~/.ssh/known_hosts
      ansible.builtin.known_hosts:
        path: ~/.ssh/known_hosts
        name: "{{ address }}"
        key: "{{ item }}"
      loop: "{{ lookup('ansible.builtin.file', repo + '/secrets/known_hosts').splitlines() | select('match', address ~ ' ') }}"
      loop_control:
        label: "{{ item.split()[0] }} {{ item.split()[1] }}"
      throttle: 1 # one machine at a time: they all write the same file

# Guests differ by their "os" (inventory): Alpine guests are Docker hosts, Debian guests run Debian packages.
- name: Sort the guests by their os
  hosts: guests
  gather_facts: false
  tasks:
    - name: Put each guest in the group os_<its os>
      ansible.builtin.group_by:
        key: os_{{ os }}
      changed_when: false

- name: Set up the guests
  hosts: "{{ guest | default('guests') }}:&os_alpine"
  gather_facts: false
  tasks:
    # Alpine comes without Python, which every other Ansible step needs; "raw" runs a plain command.
    # "executable" is required: without it, raw doesn't wrap the command in a shell, and the
    # connection passes it on unquoted, so the Proxmox machine's shell would run everything after "||".
    - name: Install Python
      ansible.builtin.raw: command -v python3 || apk add --no-cache python3
      args:
        executable: /bin/sh
      register: python
      changed_when: "'Installing' in python.stdout"

    # Docker is in Alpine's "community" repository; the template may list only "main".
    - name: Turn on Alpine's community repository
      ansible.builtin.shell: |
        grep -q '/community$' /etc/apk/repositories && exit 0
        sed -n 's#/main$#/community#p' /etc/apk/repositories >> /etc/apk/repositories && echo added
      register: community_repo
      changed_when: "'added' in community_repo.stdout"

    - name: Install all updates
      ansible.builtin.command: apk upgrade --update-cache --no-cache
      register: upgrade
      changed_when: "'Upgrading' in upgrade.stdout or 'Installing' in upgrade.stdout"

    # buildx: compose needs it to build images from a Dockerfile (e.g. Caddy's, stage 5).
    - name: Install Docker and its compose and build plugins
      ansible.builtin.command: apk add --no-cache docker docker-cli-compose docker-cli-buildx
      register: docker_packages
      changed_when: "'Installing' in docker_packages.stdout"

    # Without this Docker reports 0 B memory for its containers (see the file for why).
    - name: Install the service that lets Docker measure its containers
      ansible.builtin.copy:
        src: cgroup-delegation.initd
        dest: /etc/init.d/cgroup-delegation
        mode: "0755"

    - name: Run it now and at every boot (before Docker)
      ansible.builtin.service:
        name: cgroup-delegation
        state: started
        enabled: true
      register: cgroup_delegation

    # Docker's default log files (json-file) grow forever. "local" keeps them compressed and capped at about
    # 100 MB per container (newest kept); `docker logs` and Arcane's log view work the same.
    - name: Create Docker's settings folder (the package doesn't)
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Keep container logs compressed and capped (Docker's "local" log driver)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "local"
          }
        mode: "0644"
      register: docker_settings

    - name: Start Docker now and at every boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # Running containers keep their old groups until Docker restarts, and Docker reads daemon.json only at
    # start. One guest at a time, so the DNS nodes are never down together.
    - name: Restart Docker once, for new cgroup or Docker settings
      ansible.builtin.service:
        name: docker
        state: restarted
      when: cgroup_delegation is changed or docker_settings is changed # noqa: no-handler (must happen here, before the test)
      throttle: 1

    # Proves Docker works in this LXC: unprivileged, with nesting, without keyctl (only root may set that).
    - name: Run a test container
      ansible.builtin.command: docker run --rm hello-world
      register: hello
      changed_when: false
      failed_when: "'Hello from Docker!' not in hello.stdout"

    - name: Done
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is ready for containers. Next: stage 5 (services)."

# Debian guests: Python (the standard template may lack it) and all updates.
- name: Set up the Debian guests
  hosts: "{{ guest | default('guests') }}:&os_debian"
  gather_facts: false
  tasks:
    # See "Install Python" above for why "executable" is needed.
    - name: Install Python
      ansible.builtin.raw: command -v python3 || { apt-get update && apt-get install -y python3; }
      args:
        executable: /bin/sh
      register: debian_python
      changed_when: "'Setting up' in debian_python.stdout"

    - name: Install all updates
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Done
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is up to date. Next: stage 5 (services)."

# VMs run their own SSH server (keys from cloud-init, stage 3); the first login records the VM's host key.
- name: Set up the VMs
  hosts: "{{ guest | default('vms') }}:&vms"
  gather_facts: false
  tasks:
    - name: Wait until the VM accepts SSH (a new VM needs a minute for cloud-init)
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Install all updates
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Check whether the updates need a restart
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Restart the VM for its updates
      ansible.builtin.reboot:
        msg: Restart by stage 4 (infra-as-script) for updates
      when: reboot_required.stat.exists

    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is up to date. Next: stage 5 (services).
