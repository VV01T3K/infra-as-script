---
- name: Lock the checkout and prepare installer SSH access
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.import_role:
        name: controller
        tasks_from: lock
    - name: Check for an existing runtime key
      ansible.builtin.stat:
        path: '{{ repo_root }}/secrets/proxmox/proxmox_bootstrap'
      register: runtime_key
    - name: Seed runtime access from the USB installer key
      ansible.builtin.copy:
        src: '{{ repo_root }}/secrets/installer/pve/bootstrap{{ item }}'
        dest: '{{ repo_root }}/secrets/proxmox/proxmox_bootstrap{{ item }}'
        mode: '0600'
      loop: ['', '.pub']
      when: not runtime_key.stat.exists
      no_log: true

- name: Update and configure the Proxmox host
  hosts: pve
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.import_role:
        name: proxmox
        tasks_from: ready
    - name: Gather host facts after SSH becomes available
      ansible.builtin.setup: {}
    - ansible.builtin.import_role:
        name: proxmox
        tasks_from: configure
    - ansible.builtin.import_role:
        name: proxmox
        tasks_from: access
    - ansible.builtin.import_role:
        name: proxmox
        tasks_from: template

- name: Retire installer credentials and release the checkout lock
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    secrets_action: post-install
  tasks:
    - ansible.builtin.import_role:
        name: credentials
        tasks_from: prepare
    - ansible.builtin.import_role:
        name: credentials
        tasks_from: manage
    - ansible.builtin.import_role:
        name: controller
        tasks_from: unlock
