# Stage 5: the platform services: Caddy (HTTPS proxy), Arcane (manager + agents), the DNS cluster (Technitium),
# OpenMediaVault (the VM "nas"), Proxmox Datacenter Manager (the guest "pdm") and CLIProxyAPI.
# Run: mise run services   (one part only: add e.g. --tags dns)
# Needs: stage 4 done for the guests, and cloudflare_api_token in secrets/services.sops.yaml.
# Two YubiKey touches: the fleet key, then the service secrets.
# Parts (tags): proxy, arcane, agents, dns, nas, pdm, cliproxy. Apps come later from services/ through Arcane's GitOps.
# Every API call runs inside the guest against 127.0.0.1, so no password crosses the network.

- name: Prepare the service secrets
  hosts: guests:vms:proxmox
  gather_facts: false
  tags: [always]
  vars:
    repo: "{{ playbook_dir | dirname | dirname }}"
  tasks:
    # Docker (Arcane agents) runs only on the Alpine guests.
    - name: Put each guest in the group os_<its os>
      ansible.builtin.group_by:
        key: os_{{ os | default('none') }}
      changed_when: false

    - name: Read the service secrets (unlocked by scripts/with-service-secrets.sh)
      ansible.builtin.set_fact:
        service_secrets: "{{ lookup('ansible.builtin.env', 'SERVICE_SECRETS') | default('{}', true) | from_json }}"
      run_once: true
      no_log: true

    # Arcane's password rule ("strong"): 12+ characters with upper and lower case, a digit and a symbol.
    # A stored Arcane password that doesn't meet it is replaced.
    - name: Create the secrets that don't exist yet
      ansible.builtin.set_fact:
        new_secrets: >-
          {{ generated | dict2items | rejectattr('key', 'in', kept) | items2dict }}
      vars:
        strong: '^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{12,}$'
        kept: >-
          {{ service_secrets.keys() | list
             | difference([] if service_secrets.arcane_admin_password | default('') is match(strong) else ['arcane_admin_password']) }}
        password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
        generated:
          technitium_admin_password: "{{ password }}"
          nas_admin_password: "{{ password }}"
          nas_root_password: "{{ password }}" # console login of the VM nas (SSH takes keys only)
          nas_user_password: "{{ password }}" # the NAS user (SMB login), see nas_user
          pdm_root_password: "{{ password }}" # PDM web UI (root, Linux PAM) and the guest's console
          pdm_tokens: {} # API token secret of PDM on each Proxmox machine (filled by the part "pdm")
          arcane_admin_password: "{{ password }}-{{ lookup('ansible.builtin.password', '/dev/null', length=4, chars=['digits']) }}"
          arcane_encryption_key: "{{ password }}"
          # Arcane accepts only keys of the form arc_<hex>.
          arcane_api_key: "arc_{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['hexdigits']) | lower }}"
          arcane_agent_tokens: {}
          cliproxy_management_key: "{{ password }}" # CLIProxyAPI's panel
          cliproxy_api_key: "sk-{{ password }}" # what AI clients send to CLIProxyAPI
      run_once: true
      no_log: true

    - name: Add them
      ansible.builtin.set_fact:
        service_secrets: "{{ service_secrets | combine(new_secrets) }}"
      run_once: true
      no_log: true

    - name: Save the new secrets
      ansible.builtin.include_tasks: tasks/save-secrets.yml
      when: new_secrets | length > 0

# --- 1. Caddy: HTTPS for the services on its guest (first, because Arcane is reached through it) ---

- name: Caddy (HTTPS proxy)
  hosts: proxy
  gather_facts: false
  tags: [proxy]
  vars_files: [versions.yml]
  tasks:
    - name: Require the Cloudflare token (for the certificates) in secrets/services.sops.yaml
      ansible.builtin.assert:
        that: service_secrets.cloudflare_api_token is defined
        fail_msg: "cloudflare_api_token is missing from secrets/services.sops.yaml (see the handoff)."
        quiet: true

    - name: Read the verified proxy-security activation state
      ansible.builtin.include_tasks: tasks/proxy-security-state.yml

    - name: Require restored certificate storage and CrowdSec before integration
      ansible.builtin.include_tasks: tasks/proxy-security-preflight.yml
      when: caddy_security_enabled | default(false) | bool

    - name: Deploy Caddy (the first run builds its image, a few minutes)
      ansible.builtin.include_tasks: tasks/compose.yml
      vars:
        compose_name: caddy
        compose_template: caddy.compose.yaml.j2
        compose_dirs: [/opt/caddy/backends]
        compose_files:
          caddy.Dockerfile.j2: Dockerfile
          Caddyfile.j2: Caddyfile

- name: Cloudflared connector after verified tunnel cutover
  hosts: proxy
  gather_facts: false
  tags: [cloudflared]
  tasks:
    - name: Read the verified tunnel activation state
      ansible.builtin.stat:
        path: /opt/caddy/tunnel-enabled
      register: cloudflared_marker

    - name: Deploy the retained connector
      ansible.builtin.include_tasks: tasks/compose.yml
      vars:
        compose_name: cloudflared
        compose_template: cloudflared.compose.yaml.j2
      when: cloudflared_marker.stat.exists

# --- 2. Arcane manager ---

- name: Arcane manager
  hosts: arcane_manager
  gather_facts: false
  tags: [arcane]
  vars_files: [versions.yml]
  vars:
    arcane_api: http://127.0.0.1:3552/api
    # Kept in code: a change in the web UI is set back on the next run.
    arcane_admin_preferences: # the user "arcane": English and 24-hour time (otherwise it follows the browser)
      locale: en
      timeFormat: 24h
    arcane_settings: # global settings ("0" = the manager's own environment); values are strings
      enableGravatar: "false" # no avatar requests from the browser to gravatar.com
      autoUpdate: "false" # versions are pinned in this repo; Arcane must not update containers by itself
  tasks:
    - name: Deploy Arcane
      ansible.builtin.include_tasks: tasks/compose.yml
      vars:
        compose_name: arcane
        compose_template: arcane.compose.yaml.j2
        compose_dirs: [/opt/arcane/projects]

    - name: Prepare writable projects for the manager runtime user
      ansible.builtin.include_tasks: tasks/arcane-project-storage.yml

    - name: Wait for Arcane's API
      ansible.builtin.uri:
        url: http://127.0.0.1:3552/api/environments
        headers: { X-Api-Key: "{{ service_secrets.arcane_api_key }}" }
      register: arcane_up
      until: arcane_up.status == 200
      retries: 30
      delay: 2
      no_log: true

    # Arcane starts with admin "arcane" / "arcane-admin". 401 ("current password is incorrect") means
    # it was changed already; anything else (e.g. 400: password rule) fails here.
    - name: Replace the default admin password with the one in secrets/services.sops.yaml
      ansible.builtin.uri:
        url: http://127.0.0.1:3552/api/auth/password
        method: POST
        headers: { X-Api-Key: "{{ service_secrets.arcane_api_key }}" }
        body_format: json
        body: { currentPassword: arcane-admin, newPassword: "{{ service_secrets.arcane_admin_password }}" }
        status_code: [200, 401]
      register: arcane_password
      changed_when: arcane_password.status == 200
      no_log: true

    - name: Check that the admin can log in with the password from secrets/services.sops.yaml
      ansible.builtin.uri:
        url: http://127.0.0.1:3552/api/auth/login
        method: POST
        body_format: json
        body: { username: arcane, password: "{{ service_secrets.arcane_admin_password }}" }
      no_log: true

    - name: Read the user "arcane" and the global settings
      ansible.builtin.uri:
        url: "{{ arcane_api }}/{{ item }}"
        headers: { X-Api-Key: "{{ service_secrets.arcane_api_key }}" }
      loop: ["users?limit=100", environments/0/settings]
      register: arcane_current
      no_log: true

    # Only the keys set in code are compared; a key Arcane doesn't report counts as empty.
    - name: Compare them with the code
      ansible.builtin.set_fact:
        arcane_admin: "{{ admin }}"
        arcane_admin_now: "{{ dict(wanted_user | zip(wanted_user | map('extract', blank_user | combine(admin)))) }}"
        arcane_settings_now: "{{ dict(wanted_settings | zip(wanted_settings | map('extract', blank_settings | combine(current)))) }}"
      vars:
        admin: "{{ arcane_current.results[0].json.data | selectattr('username', 'eq', 'arcane') | first }}"
        current: "{{ arcane_current.results[1].json | items2dict(key_name='key', value_name='value') }}"
        wanted_user: "{{ arcane_admin_preferences.keys() | list }}"
        wanted_settings: "{{ arcane_settings.keys() | list }}"
        blank_user: "{{ dict(wanted_user | zip(wanted_user | map('regex_replace', '.*', ''))) }}"
        blank_settings: "{{ dict(wanted_settings | zip(wanted_settings | map('regex_replace', '.*', ''))) }}"

    - name: Set the language and time format of the user "arcane"
      ansible.builtin.uri:
        url: "{{ arcane_api }}/users/{{ arcane_admin.id }}"
        method: PUT
        headers: { X-Api-Key: "{{ service_secrets.arcane_api_key }}" }
        body_format: json
        body: "{{ arcane_admin_preferences }}"
      changed_when: true
      when: arcane_admin_now != arcane_admin_preferences
      no_log: true

    - name: Set the global settings
      ansible.builtin.uri:
        url: "{{ arcane_api }}/environments/0/settings"
        method: PUT
        headers: { X-Api-Key: "{{ service_secrets.arcane_api_key }}" }
        body_format: json
        body: "{{ arcane_settings }}"
      changed_when: true
      when: arcane_settings_now != arcane_settings
      no_log: true

# --- 3. Arcane agents: every Docker guest except the manager's ---

- name: Arcane agents
  hosts: os_alpine:!arcane_manager
  gather_facts: false
  tags: [agents]
  vars_files: [versions.yml]
  vars:
    repo: "{{ playbook_dir | dirname | dirname }}"
    arcane_api: http://127.0.0.1:3552/api
    manager: "{{ groups.arcane_manager | first }}"
  tasks:
    - name: Read Arcane's environments (hosts it manages)
      ansible.builtin.uri:
        url: "{{ arcane_api }}/environments"
        headers: { X-Api-Key: "{{ service_secrets.arcane_api_key }}" }
      register: environments
      delegate_to: "{{ manager }}"
      run_once: true
      no_log: true

    # An agent's key is shown only once, when its environment is created. A guest gets a new environment
    # when it has none, or when its key is not in secrets/services.sops.yaml (the old environment goes).
    - name: List the existing environments by name
      ansible.builtin.set_fact:
        existing: "{{ dict(environments.json.data | map(attribute='name') | zip(environments.json.data | map(attribute='id'))) }}"
      run_once: true

    - name: Find the guests that need a new environment
      ansible.builtin.set_fact:
        renew: >-
          {{ ansible_play_hosts | reject('in', service_secrets.arcane_agent_tokens)
             | union(ansible_play_hosts | reject('in', existing)) }}
      run_once: true

    - name: Delete the environments whose key was lost
      ansible.builtin.uri:
        url: "{{ arcane_api }}/environments/{{ existing[item] }}"
        method: DELETE
        headers: { X-Api-Key: "{{ service_secrets.arcane_api_key }}" }
        status_code: [200, 204]
      loop: "{{ renew | select('in', existing) }}"
      changed_when: true
      delegate_to: "{{ manager }}"
      run_once: true
      no_log: true

    - name: Create the environments
      ansible.builtin.uri:
        url: "{{ arcane_api }}/environments"
        method: POST
        headers: { X-Api-Key: "{{ service_secrets.arcane_api_key }}" }
        body_format: json
        body: { name: "{{ item }}", apiUrl: "edge://{{ item }}", useApiKey: true, isEdge: true }
        status_code: [200, 201]
      loop: "{{ renew }}"
      register: created
      changed_when: true
      delegate_to: "{{ manager }}"
      run_once: true
      no_log: true

    - name: Remember the new agent keys
      ansible.builtin.set_fact:
        service_secrets: "{{ service_secrets | combine({'arcane_agent_tokens': new_tokens}, recursive=true) }}"
      vars:
        new_tokens: "{{ dict(created.results | map(attribute='item') | zip(created.results | map(attribute='json.data.apiKey'))) }}"
      run_once: true
      no_log: true
      when: renew | length > 0

    - name: Save them
      ansible.builtin.include_tasks: tasks/save-secrets.yml
      when: renew | length > 0

    - name: Deploy the agent
      ansible.builtin.include_tasks: tasks/compose.yml
      vars:
        compose_name: arcane-agent
        compose_template: arcane-agent.compose.yaml.j2

# --- 4. DNS cluster: dns1 creates it and holds the configuration, the others join ---

- name: DNS cluster (Technitium)
  hosts: dns
  serial: 1 # the first node (primary) is finished before the others join it
  gather_facts: false
  tags: [dns]
  vars_files: [versions.yml, dns.yml]
  vars:
    api: http://127.0.0.1:5380/api
    primary: "{{ groups.dns | first }}"
    is_primary: "{{ inventory_hostname == primary }}"
  tasks:
    - name: Deploy Technitium
      ansible.builtin.include_tasks: tasks/compose.yml
      vars:
        compose_name: technitium
        compose_template: technitium.compose.yaml.j2

    - name: Log in to Technitium's API
      ansible.builtin.uri:
        url: "{{ api }}/user/login"
        method: POST
        body_format: form-urlencoded
        body: { user: admin, pass: "{{ service_secrets.technitium_admin_password }}" }
      register: login
      until: login.json.status | default('') == 'ok'
      retries: 30
      delay: 2
      no_log: true

    - name: Read the cluster state
      ansible.builtin.uri:
        url: "{{ api }}/admin/cluster/state"
        headers: { Authorization: "Bearer {{ login.json.token }}" }
      register: cluster
      failed_when: cluster.json.status != 'ok'

    - name: Create the cluster, with this node as primary, for {{ dns_cluster_domain }}
      ansible.builtin.uri:
        url: "{{ api }}/admin/cluster/init"
        method: POST
        headers: { Authorization: "Bearer {{ login.json.token }}" }
        body_format: form-urlencoded
        body: { clusterDomain: "{{ dns_cluster_domain }}", primaryNodeIpAddresses: "{{ address }}" }
      register: cluster_init
      changed_when: true
      failed_when: cluster_init.json.status != 'ok'
      when: is_primary and not cluster.json.response.clusterInitialized

    # The nodes talk HTTPS with Technitium's self-signed certificates inside the Infra network.
    # The primary is named by its node domain (as its certificate); its address is given too, so no
    # DNS lookup is needed.
    - name: Join the cluster
      ansible.builtin.uri:
        url: "{{ api }}/admin/cluster/initJoin"
        method: POST
        headers: { Authorization: "Bearer {{ login.json.token }}" }
        body_format: form-urlencoded
        body:
          secondaryNodeIpAddresses: "{{ address }}"
          primaryNodeUrl: https://{{ primary }}.{{ dns_cluster_domain }}:53443/
          primaryNodeIpAddress: "{{ hostvars[primary].address }}"
          ignoreCertificateErrors: "true"
          primaryNodeUsername: admin
          primaryNodePassword: "{{ service_secrets.technitium_admin_password }}"
        timeout: 300
      register: cluster_join
      changed_when: true
      failed_when: false # checked below, where the error can be shown without the password
      when: not is_primary and not cluster.json.response.clusterInitialized
      no_log: true

    - name: Check that joining worked
      ansible.builtin.assert:
        that: cluster_join.json.status | default('') == 'ok'
        fail_msg: "Joining failed: {{ cluster_join.json.errorMessage | default(cluster_join.msg | default('no answer')) }}"
        quiet: true
      when: cluster_join is not skipped

    - name: Configure the cluster (on the primary; it passes everything on)
      ansible.builtin.include_tasks: tasks/technitium-config.yml
      when: is_primary

    - name: Log out of Technitium's API
      ansible.builtin.uri:
        url: "{{ api }}/user/logout"
        headers: { Authorization: "Bearer {{ login.json.token }}" }
      changed_when: false
      failed_when: false # joining the cluster replaces the users, so this session may be gone already

# --- 5. OpenMediaVault on the VM "nas" ---
# Installed on top of Debian with the steps of OMV's own guide (docs.openmediavault.org, 8.x, "on Debian").
# OMV then owns the VM's network settings: its interface gets the same fixed address cloud-init gave it, and
# cloud-init stops managing the network. The web UI login is "admin" with nas_admin_password, the console
# login "root" with nas_root_password (both in secrets/services.sops.yaml). The data disk (filesystem, shares) comes in a later step.

- name: OpenMediaVault
  hosts: nas # only this VM (2026-10-06: "vms" also ran this on another VM)
  tags: [nas]
  vars:
    iface: "{{ ansible_facts.default_ipv4.interface }}"
    net: "{{ networks[network] }}"
    # OMV's ID for "a new object" in its configuration database (OMV_CONFIGOBJECT_NEW_UUID).
    omv_new_uuid: fa4b1c66-ef79-11e5-87a0-0002b3a176b4
    # The NAS's own user (SMB login; password nas_user_password in secrets/services.sops.yaml).
    nas_user: wojtek
    # Shared folders on the data disk: mode of the folder, users with read/write access, smb = shared over SMB.
    nas_shares:
      wojtek: { mode: "770", users: [wojtek], smb: true, comment: "wojtek's files" }
  tasks:
    - name: Check whether OpenMediaVault is installed
      ansible.builtin.command: dpkg-query --show --showformat=${Status} openmediavault
      register: omv_package
      changed_when: false
      failed_when: false

    - name: Install OpenMediaVault
      when: "'install ok installed' not in omv_package.stdout"
      block:
        # Needed before OMV's package, or its installation leaves the VM without DNS.
        - name: Install systemd-resolved and the tools the guide asks for
          ansible.builtin.apt:
            name: [systemd-resolved, psmisc, gnupg]

        - name: Start systemd-resolved now and at every boot
          ansible.builtin.systemd_service:
            name: systemd-resolved
            enabled: true
            state: restarted

        - name: Use the router as DNS server for {{ iface }}
          ansible.builtin.command: resolvectl dns {{ iface }} {{ net.gateway }}
          changed_when: true

        - name: Add OpenMediaVault's signing key
          ansible.builtin.shell: |
            set -o pipefail
            wget --quiet --output-document=- https://packages.openmediavault.io/archive.key \
              | gpg --dearmor --yes --output /usr/share/keyrings/openmediavault-archive-keyring.gpg
          args:
            executable: /bin/bash
            creates: /usr/share/keyrings/openmediavault-archive-keyring.gpg

        - name: Add OpenMediaVault's package sources (8.x "synchrony")
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/openmediavault.list
            content: |
              # Managed by stage 5 (infra-as-script).
              deb [signed-by=/usr/share/keyrings/openmediavault-archive-keyring.gpg] http://packages.openmediavault.org/public/ synchrony main
              deb [signed-by=/usr/share/keyrings/openmediavault-archive-keyring.gpg] http://packages.openmediavault.io/ synchrony main
            mode: "0644"

        # The same options as the guide's apt-get command.
        - name: Install the package openmediavault (a few minutes)
          ansible.builtin.apt:
            name: openmediavault
            update_cache: true
            install_recommends: false
            autoremove: true
            allow_downgrade: true
            allow_change_held_packages: true
            dpkg_options: force-confdef,force-confold
          environment:
            LANG: C.UTF-8
            DEBIAN_FRONTEND: noninteractive
            APT_LISTCHANGES_FRONTEND: none


    # OMV writes sshd's settings itself. A fresh install allows password logins; here: keys only (root's own
    # .ssh/authorized_keys, from cloud-init, stays in use), as on every other machine.
    - name: Read OpenMediaVault's SSH settings
      ansible.builtin.command: omv-confdbadm read conf.service.ssh
      register: omv_ssh
      changed_when: false

    - name: Allow SSH logins with keys only
      ansible.builtin.shell: |
        omv-rpc -u admin Ssh set "$SETTINGS" >/dev/null
        omv-salt deploy run ssh
      environment:
        SETTINGS: "{{ wanted | to_json }}"
      vars:
        wanted:
          enable: true
          port: 22
          passwordauthentication: false
          pubkeyauthentication: true
          permitrootlogin: true
          tcpforwarding: false
          compression: false
          extraoptions: ""
      when: (omv_ssh.stdout | from_json) | dict2items | selectattr('key', 'in', wanted) | items2dict != wanted
      changed_when: true

    # OMV's first-time setup (populate) imports existing netplan files, but its import of DNS servers fails
    # (OMV 8 bug: it writes "dnsservers", the model calls it "dnsnameservers"). So cloud-init's file is moved
    # aside first (kept in /root for going back) and cloud-init stops managing the network; the running network
    # is untouched, and OMV gets the same address right below. The marker file says the setup is done.
    - name: Fill OpenMediaVault's configuration database (once)
      ansible.builtin.shell: |
        set -e
        mkdir -p /etc/cloud/cloud.cfg.d
        printf '%s\n' '# Managed by stage 5 (infra-as-script): OpenMediaVault manages the network.' \
          'network: {config: disabled}' > /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        [ ! -e /etc/netplan/50-cloud-init.yaml ] || mv /etc/netplan/50-cloud-init.yaml /root/50-cloud-init.yaml.before-omv
        omv-confdbadm populate
        touch /etc/openmediavault/.populated-by-infra-as-script
      args:
        creates: /etc/openmediavault/.populated-by-infra-as-script

    - name: Read the network interfaces OpenMediaVault knows
      ansible.builtin.command: omv-confdbadm read conf.system.network.interface
      register: omv_interfaces
      changed_when: false

    # Set (or corrected) when OMV doesn't have the interface with exactly this fixed address yet.
    - name: Hand the network over to OpenMediaVault (same fixed address)
      vars:
        omv_iface: "{{ omv_interfaces.stdout | from_json | selectattr('devicename', 'eq', iface) | first | default({}) }}"
      when: >-
        omv_iface.method | default('') != 'static' or omv_iface.address | default('') != address
        or omv_iface.gateway | default('') != net.gateway
      block:
        - name: Give OpenMediaVault the network interface with the fixed address {{ address }}
          ansible.builtin.command:
            argv:
              - omv-rpc
              - -u
              - admin
              - Network
              - setEthernetIface
              - "{{ settings | to_json }}"
          vars:
            settings:
              uuid: "{{ omv_iface.uuid | default(omv_new_uuid) }}"
              devicename: "{{ iface }}"
              method: static
              address: "{{ address }}"
              netmask: "{{ ansible_facts.default_ipv4.netmask }}" # as cloud-init set it from the inventory
              gateway: "{{ net.gateway }}"
              routemetric: 0
              method6: manual
              address6: ""
              netmask6: 64
              gateway6: ""
              routemetric6: 1
              dnsnameservers: "{{ net.gateway }}"
              dnssearch: ""
              mtu: 0
              wol: false
              comment: "Managed by stage 5 (infra-as-script)"
              altmacaddress: ""
          changed_when: true

        # Runs in the background: the SSH connection may blink while the network is re-applied.
        - name: Apply OpenMediaVault's network settings
          ansible.builtin.command: omv-salt deploy run systemd-networkd
          async: 300
          poll: 5
          changed_when: true

        - name: Log in again over the new settings
          ansible.builtin.wait_for_connection:
            timeout: 120

    # Only for the VM's Proxmox console: the way back in if its network setup ever fails.
    - name: Set root's console password (from secrets/services.sops.yaml)
      ansible.builtin.user:
        name: root
        password: "{{ service_secrets.nas_root_password | password_hash('sha512', (inventory_hostname | hash('sha256'))[16:32]) }}"
      no_log: true

    - name: Set the web UI password of "admin" (from secrets/services.sops.yaml)
      ansible.builtin.user:
        name: admin
        password: "{{ service_secrets.nas_admin_password | password_hash('sha512', (inventory_hostname | hash('sha256'))[:16]) }}"
      no_log: true

    - name: Data disk, shared folders, user and SMB
      ansible.builtin.include_tasks: tasks/nas-storage.yml

    # The web UI over HTTPS only, with OMV's own self-signed certificate for nas.<domain>. Caddy serves it as
    # https://omv.<domain> and trusts exactly this certificate (the part "Caddy routes", at the end).
    - name: Read OMV's web UI settings and certificates
      ansible.builtin.command: "{{ item }}"
      loop:
        - omv-rpc -u admin WebGui getSettings
        - omv-confdbadm read conf.system.certificate.ssl
      register: omv_web
      changed_when: false
      no_log: true # the certificate list includes private keys

    - name: Create the web UI's certificate (self-signed, 10 years, for nas.{{ domain }})
      ansible.builtin.command:
        argv: [omv-rpc, -u, admin, CertificateMgmt, create, "{{ cert | to_json }}"]
      vars:
        cert: { size: 2048, days: 3650, c: "", st: "", l: "", o: "", ou: "", cn: "{{ inventory_hostname }}.{{ domain }}", email: "" }
      register: omv_new_cert
      changed_when: true
      when: (omv_web.results[0].stdout | from_json).sslcertificateref not in omv_web.results[1].stdout | from_json | map(attribute='uuid')
      no_log: true # the answer includes the private key

    - name: Serve the web UI over HTTPS only (port 443)
      ansible.builtin.command:
        argv: [omv-rpc, -u, admin, WebGui, setSettings, "{{ wanted | to_json }}"]
      vars:
        current: "{{ omv_web.results[0].stdout | from_json }}"
        ref: "{{ (omv_new_cert.stdout | from_json).uuid if omv_new_cert is changed else current.sslcertificateref }}"
        wanted: "{{ {'port': 80, 'enablessl': true, 'sslport': 443, 'forcesslonly': true, 'sslcertificateref': ref, 'timeout': current.timeout} }}"
      changed_when: true
      when: >-
        not current.enablessl | bool or not current.forcesslonly | bool or current.sslport | int != 443
        or current.sslcertificateref != ref

    # OMV marks modules as "pending" when its settings change (setup, SSH, network above); its web UI then asks
    # to apply them. Applying all pending ones is what the UI's checkmark does.
    - name: Check whether OpenMediaVault has pending changes
      ansible.builtin.command:
        argv: [omv-rpc, -u, admin, Config, isDirty, '{}'] # {} = any module
      register: omv_dirty
      changed_when: false

    - name: Apply OpenMediaVault's pending changes
      ansible.builtin.command:
        argv: [omv-rpc, -u, admin, Config, applyChanges, '{"modules": [], "force": false}']
      changed_when: true
      when: omv_dirty.stdout | trim | from_json | bool

    # Only that it answers; its certificate is checked by Caddy (the part "Caddy routes").
    - name: Check that the web UI answers (HTTPS)
      ansible.builtin.uri:
        url: https://{{ address }}/
        validate_certs: false
        status_code: 200
      delegate_to: localhost

# --- 6. Proxmox Datacenter Manager (PDM) on the Debian guest "pdm" ---
# One web UI for torus and kestrel (not clustered): https://pdm.lab.wsiwiec.com:8443, login root (Linux PAM),
# password pdm_root_password. PDM reaches each machine's API with its own token of the user pdm@pve, whose role
# can see everything and start, stop and migrate guests (no root, unlike PDM's own setup wizard). Stage 2's
# firewall lets pdm reach port 8006 (api_from).

- name: PDM's access to the Proxmox machines
  hosts: proxmox
  tags: [pdm]
  gather_facts: false
  vars:
    pdm_privileges:
      - Sys.Audit # node status, tasks, updates
      - VM.Audit # guests and their settings
      - Datastore.Audit # storages
      - SDN.Audit # networks
      - Pool.Audit # resource pools
      - Mapping.Audit # USB/PCI mappings
      - VM.PowerMgmt # start, stop, shut down, restart guests
      - VM.Migrate # migrate guests
    # The machines whose token was made in this run.
    made: "{{ ansible_play_hosts | map('extract', hostvars) | selectattr('pdm_new_token.stdout', 'defined') | map(attribute='inventory_hostname') | list }}"
  tasks:
    - name: Read the roles, users and tokens
      ansible.builtin.command: pvesh get {{ item }} --output-format json
      loop: [/access/roles, /access/users, /access/acl]
      register: pdm_access
      changed_when: false

    - name: Give the role "PDM" exactly its privileges
      ansible.builtin.command: pveum role {{ 'modify' if current else 'add' }} PDM --privs {{ wanted }}
      vars:
        current: "{{ pdm_access.results[0].stdout | from_json | selectattr('roleid', 'eq', 'PDM') | first | default({}) }}"
        wanted: "{{ pdm_privileges | sort(case_sensitive=true) | join(',') }}"
      changed_when: true
      when: current.privs | default('') != wanted

    - name: Create the user pdm@pve (token only, no password)
      ansible.builtin.command: pveum user add pdm@pve --comment "Proxmox Datacenter Manager (infra-as-script)"
      changed_when: true
      when: "'pdm@pve' not in pdm_access.results[1].stdout | from_json | map(attribute='userid')"

    - name: Grant it the role "PDM" on everything (/)
      ansible.builtin.command: pveum acl modify / --users pdm@pve --roles PDM
      changed_when: true
      when: >-
        pdm_access.results[2].stdout | from_json | selectattr('ugid', 'eq', 'pdm@pve')
        | selectattr('path', 'eq', '/') | selectattr('roleid', 'eq', 'PDM') | list | length == 0

    - name: Read the user's tokens
      ansible.builtin.command: pvesh get /access/users/pdm@pve/token --output-format json
      register: pdm_token_list
      changed_when: false

    # Made again when the machine doesn't have it or its secret is not in secrets/services.sops.yaml.
    - name: Make the token pdm@pve!pdm (same rights as the user)
      ansible.builtin.shell: |
        pveum user token remove pdm@pve pdm 2>/dev/null
        pveum user token add pdm@pve pdm --privsep 0 --output-format json
      register: pdm_new_token
      changed_when: true
      when: >-
        inventory_hostname not in service_secrets.pdm_tokens | default({})
        or 'pdm' not in pdm_token_list.stdout | from_json | map(attribute='tokenid')
      no_log: true

    - name: Remember the new token secrets (all machines)
      ansible.builtin.set_fact:
        service_secrets: "{{ service_secrets | combine({'pdm_tokens': dict(made | zip(values))}, recursive=true) }}"
      vars:
        values: "{{ made | map('extract', hostvars, ['pdm_new_token', 'stdout']) | map('from_json') | map(attribute='value') | list }}"
      run_once: true
      when: made | length > 0
      no_log: true

    - name: Save them
      ansible.builtin.include_tasks: tasks/save-secrets.yml
      vars:
        repo: "{{ playbook_dir | dirname | dirname }}"
      when: made | length > 0

    # PDM pins the certificate the machine's web API shows (its own, or Proxmox's default).
    - name: Read the fingerprint of this machine's web API certificate
      ansible.builtin.shell: |
        cert=/etc/pve/local/pveproxy-ssl.pem
        [ -e "$cert" ] || cert=/etc/pve/local/pve-ssl.pem
        openssl x509 -in "$cert" -noout -fingerprint -sha256
      register: pdm_api_cert
      changed_when: false

    - name: Remember it (the part after "sha256 Fingerprint=")
      ansible.builtin.set_fact:
        pdm_api_fingerprint: "{{ pdm_api_cert.stdout.split('=')[-1] | trim }}"

- name: Proxmox Datacenter Manager
  hosts: pdm
  tags: [pdm]
  tasks:
    - name: Add Proxmox's signing key (checksum from the PDM docs)
      ansible.builtin.get_url:
        url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        checksum: sha256:136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
        mode: "0644"

    - name: Add the free (no-subscription) PDM package source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/proxmox.sources
        content: |
          # Managed by stage 5 (infra-as-script).
          Types: deb
          URIs: http://download.proxmox.com/debian/pdm
          Suites: trixie
          Components: pdm-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: "0644"

    # PDM's package ships the paid source (a conffile), which answers 401 without a subscription and breaks
    # every apt update. Written first, turned off; dpkg then keeps this version (apt's force-confold).
    - name: Turn off the paid (enterprise) PDM package source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pdm-enterprise.sources
        content: |
          # Managed by stage 5 (infra-as-script): needs a subscription.
          Types: deb
          URIs: https://enterprise.proxmox.com/debian/pdm
          Suites: trixie
          Components: pdm-enterprise
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
          Enabled: false
        mode: "0644"

    # The PDM package adds Proxmox's paid (enterprise) source, which needs a subscription; while it is on, every
    # package update fails with "401 Unauthorized". Turned off wherever it appears.
    - name: Find Proxmox's paid (enterprise) package sources
      ansible.builtin.command: grep -l enterprise.proxmox.com -r /etc/apt/sources.list.d
      register: pdm_enterprise
      changed_when: false
      failed_when: pdm_enterprise.rc > 1 # 1 = none found

    - name: Turn them off
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: "^Enabled:"
        line: "Enabled: false"
      loop: "{{ pdm_enterprise.stdout_lines }}"

    # The container package: PDM without a kernel of its own (pdm.proxmox.com/docs, installation).
    - name: Install Proxmox Datacenter Manager (for containers)
      ansible.builtin.apt:
        name: proxmox-datacenter-manager-container-meta
        update_cache: true

    - name: Turn off the paid source if this install just added it
      ansible.builtin.shell: |
        for f in $(grep -l enterprise.proxmox.com -r /etc/apt/sources.list.d); do
          grep -qx 'Enabled: false' "$f" || { sed -i '/^Enabled:/d' "$f"; echo 'Enabled: false' >> "$f"; echo "turned off $f"; }
        done
      register: pdm_enterprise_after
      changed_when: "'turned off' in pdm_enterprise_after.stdout"

    - name: Set root's password (PDM web UI and console, from secrets/services.sops.yaml)
      ansible.builtin.user:
        name: root
        password: "{{ service_secrets.pdm_root_password | password_hash('sha512', (inventory_hostname | hash('sha256'))[16:32]) }}"
      no_log: true

    - name: Read PDM's remotes
      ansible.builtin.command: proxmox-datacenter-manager-admin remote list --output-format json
      register: pdm_remotes
      changed_when: false

    # Each Proxmox machine is one remote, named like the machine, with its address and certificate fingerprint.
    - name: Add or update each Proxmox machine as a remote
      ansible.builtin.command:
        argv: "{{ (['proxmox-datacenter-manager-admin', 'remote'] + (['update', item] if exists else ['add', '--type', 'pve', '--id', item])
                  + ['--nodes', nodes, '--authid', 'pdm@pve!pdm', '--token', hostvars[item].service_secrets.pdm_tokens[item]]) }}"
      vars:
        current: "{{ pdm_remotes.stdout | from_json | selectattr('id', 'eq', item) | first | default({}) }}"
        exists: "{{ current | length > 0 }}"
        nodes: "{{ hostvars[item].address }},fingerprint={{ hostvars[item].pdm_api_fingerprint }}"
        # PDM lists each node as a property string: "[hostname=]<address>[,fingerprint=<fp>]".
        current_nodes: "{{ current.nodes | default([]) | map('regex_replace', '^(?:.*,)?(?:hostname=)?([^,=]+)(?:,.*)?$', '\\1') | list }}"
        current_fp: "{{ current.nodes | default([]) | map('regex_replace', '^.*fingerprint=([^,]+).*$|^.*$', '\\1') | list }}"
        renewed: "{{ hostvars[item].pdm_new_token.stdout is defined }}"
      loop: "{{ groups.proxmox }}"
      changed_when: true
      when: >-
        not exists or renewed or current_nodes != [hostvars[item].address]
        or current_fp | map('lower') | list != [hostvars[item].pdm_api_fingerprint | lower] or current.authid | default('') != 'pdm@pve!pdm'
      no_log: true

# --- 7. CLIProxyAPI: the AI subscriptions behind one API ---
# https://cliproxy.lab.wsiwiec.com/v1 with cliproxy_api_key (secrets/services.sops.yaml). Subscriptions are logged
# in once in its panel (/management.html, key cliproxy_management_key); their tokens stay in the volume "auths".

- name: CLIProxyAPI
  hosts: cliproxy
  gather_facts: false
  tags: [cliproxy]
  vars_files: [versions.yml]
  tasks:
    - name: Read the address range of Caddy's network
      ansible.builtin.command:
        argv: [docker, network, inspect, caddy, --format, "{{ '{{' }}(index .IPAM.Config 0).Subnet{{ '}}' }}"]
      register: caddy_network
      changed_when: false

    - name: Deploy CLIProxyAPI
      ansible.builtin.include_tasks: tasks/compose.yml
      vars:
        cliproxy_caddy_subnet: "{{ caddy_network.stdout | trim }}"
        compose_name: cliproxy
        compose_template: cliproxy.compose.yaml.j2
        compose_files:
          cliproxy.config.yaml.j2: config.yaml

    - name: Check the API from this computer (certificate and API key checked)
      ansible.builtin.uri:
        url: https://{{ cliproxy_host }}/v1/models
        headers: { Authorization: "Bearer {{ service_secrets.cliproxy_api_key }}" }
      delegate_to: localhost
      register: cliproxy_check
      until: cliproxy_check is succeeded
      retries: 10
      delay: 3
      no_log: true

# --- 8. Caddy routes to the web UIs of other guests ---
# https://<name>.<domain> through Caddy (the wildcard certificate, no port, no browser warning) for web UIs that
# don't run on Caddy's guest. Caddy reaches each over HTTPS and trusts exactly that guest's own self-signed
# certificate (copied here; a rebuilt guest's new one is picked up by the next run). One file per route in
# /opt/caddy/backends, which the Caddyfile imports. Runs last: it needs OMV's and PDM's certificates.

- name: Caddy routes to other guests' web UIs
  hosts: proxy
  tags: [proxy, nas, pdm]
  gather_facts: false
  vars:
    # name: the guest, its port, and the file of its web certificate there ("omv" = OMV's own, looked up).
    caddy_backends:
      pdm: { host: pdm, port: 8443, cert: /etc/proxmox-datacenter-manager/auth/api.pem }
      omv: { host: nas, port: 443, cert: omv }
  tasks:
    - name: Preserve protection when updating only backend routes
      ansible.builtin.include_tasks: tasks/proxy-security-state.yml

    - name: Find OMV's web UI certificate
      ansible.builtin.command: omv-rpc -u admin WebGui getSettings
      delegate_to: nas
      register: omv_web_settings
      changed_when: false

    - name: Read each guest's certificate and the names it is valid for
      ansible.builtin.shell: |
        cat "$CERT"
        openssl x509 -in "$CERT" -noout -ext subjectAltName
      environment:
        CERT: >-
          {{ '/etc/ssl/certs/openmediavault-' ~ (omv_web_settings.stdout | from_json).sslcertificateref ~ '.crt'
             if item.value.cert == 'omv' else item.value.cert }}
      delegate_to: "{{ item.value.host }}"
      loop: "{{ caddy_backends | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: backend_certs
      changed_when: false

    - name: Write each route and its trusted certificate
      ansible.builtin.copy:
        dest: /opt/caddy/backends/{{ item.0.item.key }}.{{ item.1 }}
        content: "{{ caddy_file if item.1 == 'caddy' else pem }}"
        mode: "0644"
      vars:
        pem: "{{ item.0.stdout | regex_search('-----BEGIN CERTIFICATE-----[\\s\\S]*?-----END CERTIFICATE-----') }}\n"
        # The first DNS name in the certificate is the name Caddy expects it to show.
        server_name: "{{ item.0.stdout | regex_search('DNS:([^,\\s]+)', '\\1') | first }}"
        caddy_file: |
          # Managed by stage 5 (infra-as-script): {{ item.0.item.key }}.{{ domain }} -> {{ item.0.item.value.host }}:{{ item.0.item.value.port }}
          {{ item.0.item.key }}.{{ domain }} {
          {% if caddy_security_enabled | default(false) | bool %}
            import protected
          {% endif %}
          	reverse_proxy https://{{ hostvars[item.0.item.value.host].address }}:{{ item.0.item.value.port }} {
          		transport http {
          			tls_server_name {{ server_name }}
          			tls_trust_pool file /etc/caddy/backends/{{ item.0.item.key }}.pem
          		}
          	}
          }
      loop: "{{ backend_certs.results | product(['pem', 'caddy']) | list }}"
      loop_control:
        label: "{{ item.0.item.key }}.{{ item.1 }}"
      register: backend_files

    - name: Restart Caddy for changed routes
      ansible.builtin.command:
        cmd: docker compose restart
        chdir: /opt/caddy
      changed_when: true
      when: backend_files is changed # noqa: no-handler (needed before the check below)

    - name: Check each route from this computer (certificate checked)
      ansible.builtin.uri:
        url: https://{{ item }}.{{ domain }}/
        status_code: [200, 301, 302]
      delegate_to: localhost
      loop: "{{ caddy_backends.keys() | list }}"
      register: route_check
      until: route_check is succeeded
      retries: 10
      delay: 3
