# Saves service_secrets encrypted to secrets/services.sops.yaml. Calls `sops encrypt` directly: the sops
# module would first decrypt the existing file to compare, which needs the YubiKey PIN, and Ansible
# can't ask for it. The plain text only goes through a pipe. Expects: repo.
# Both steps run on this computer with its own Python: otherwise Ansible (run_once + delegate_to) records this
# computer's Python path as the guests' (seen on the VM "nas": /usr/bin/python3.14 not found).

- name: Encrypt the service secrets (encrypting needs no YubiKey)
  ansible.builtin.command:
    argv: [sops, encrypt, --input-type, json, --output-type, yaml, --filename-override, secrets/services.sops.yaml, /dev/stdin]
    stdin: "{{ service_secrets | to_json }}"
    chdir: "{{ repo }}"
  register: encrypted_secrets
  changed_when: false
  delegate_to: localhost
  run_once: true
  no_log: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Save them to secrets/services.sops.yaml
  ansible.builtin.copy:
    content: "{{ encrypted_secrets.stdout }}\n"
    dest: "{{ repo }}/secrets/services.sops.yaml"
    mode: "0600"
  delegate_to: localhost
  run_once: true
  no_log: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
