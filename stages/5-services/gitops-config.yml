# Public source: Arcane never needs a GitHub credential or write access.
gitops_repositories:
  - name: infra-as-script
    url: https://github.com/VV01T3K/infra-as-script.git
    authType: none
    enabled: true

# Environment names are resolved against Arcane at runtime; zoltan uses ID 0.
# No live applications or bootstrap projects are adopted here.
gitops_stacks:
  - name: gitops-canary
    environment: engi
    repository: infra-as-script
    branch: main
    composePath: services/engi/gitops-canary/compose.yaml
    autoSync: "{{ gitops_canary_auto_sync | default(true) | bool }}"
    syncInterval: 5
    # The canary has no supporting files. Future apps can opt into directory sync.
    syncDirectory: false
    secrets:
      CANARY_TOKEN: gitops_canary_token

  - name: frog-keepalive
    environment: zoltan
    repository: infra-as-script
    branch: main
    composePath: services/zoltan/frog-keepalive/compose.yaml
    autoSync: false # enable only after the state-preserving migration is verified
    syncInterval: 5
    syncDirectory: true # Dockerfile and entrypoint are part of the deployment
    secrets:
      FROG_HOST: frog_host
      FROG_PORT: frog_port
      FROG_USER: frog_user
      FROG_HOST_KEY_SHA256: frog_host_key_sha256
      KEEPALIVE_INTERVAL_DAYS: frog_keepalive_interval_days
      MAX_JITTER_SECONDS: frog_max_jitter_seconds
      RETRY_SECONDS: frog_retry_seconds
      CHECK_SECONDS: frog_check_seconds
      CONNECT_TIMEOUT_SECONDS: frog_connect_timeout_seconds

# Reconciliation alone never requests a sync. Enable after the source is pushed.
gitops_sync_now: false
