# Public source: Arcane never needs a GitHub credential or write access.
gitops_repositories:
  - name: infra-as-script
    url: https://github.com/VV01T3K/infra-as-script.git
    authType: none
    enabled: true

  - name: research-cruise
    url: https://github.com/VV01T3K/ResearchCruiseApp.git
    authType: none
    enabled: true

# Environment names are resolved against Arcane at runtime; zoltan uses ID 0.
# No live applications or bootstrap projects are adopted here.
gitops_stacks:
  - name: gitops-canary
    environment: engi
    repository: infra-as-script
    branch: main
    composePath: services/engi/gitops-canary/compose.yaml
    autoSync: "{{ gitops_canary_auto_sync | default(true) | bool }}"
    syncInterval: 5
    # The canary has no supporting files. Future apps can opt into directory sync.
    syncDirectory: false
    secrets:
      CANARY_TOKEN: gitops_canary_token

  - name: frog-keepalive
    environment: zoltan
    repository: infra-as-script
    branch: main
    composePath: services/zoltan/frog-keepalive/compose.yaml
    autoSync: false # enable only after the state-preserving migration is verified
    syncInterval: 5
    syncDirectory: true # Dockerfile and entrypoint are part of the deployment
    secrets:
      FROG_HOST: frog_host
      FROG_PORT: frog_port
      FROG_USER: frog_user
      FROG_HOST_KEY_SHA256: frog_host_key_sha256
      KEEPALIVE_INTERVAL_DAYS: frog_keepalive_interval_days
      MAX_JITTER_SECONDS: frog_max_jitter_seconds
      RETRY_SECONDS: frog_retry_seconds
      CHECK_SECONDS: frog_check_seconds
      CONNECT_TIMEOUT_SECONDS: frog_connect_timeout_seconds

  - name: valkey
    environment: zoltan
    repository: infra-as-script
    branch: main
    composePath: services/zoltan/valkey/compose.yaml
    autoSync: false
    syncInterval: 5
    syncDirectory: false
    secrets:
      VALKEY_PASSWORD: valkey_password

  - name: crowdsec
    environment: zoltan
    repository: infra-as-script
    branch: main
    composePath: services/zoltan/crowdsec/compose.yaml
    autoSync: false
    syncInterval: 5
    syncDirectory: false
    secrets:
      CROWDSEC_API_KEY: crowdsec_api_key

  - name: research-cruise
    environment: zoltan
    repository: research-cruise
    branch: staging
    composePath: docker/arcane/compose.yaml
    autoSync: true # restored database, public origin and protection verified
    syncInterval: 5
    syncDirectory: false
    secrets:
      DB_PASSWORD: cruise_db_password
      DB_CONNECTION_STRING: cruise_db_connection_string
      SMTP_USERNAME: cruise_smtp_username
      SMTP_PASSWORD: cruise_smtp_password
      JWT_SECRET: cruise_jwt_secret
      SENTRY_DSN_BACKEND: cruise_sentry_dsn_backend
      SENTRY_DSN_FRONTEND: cruise_sentry_dsn_frontend
      SENTRY_TRACES_SAMPLE_RATE: cruise_sentry_traces_sample_rate
      SENTRY_REPLAYS_SESSION_SAMPLE_RATE: cruise_sentry_replays_session_sample_rate

# Reconciliation alone never requests a sync. Enable after the source is pushed.
gitops_sync_now: false
