# What the DNS cluster (Technitium on dns1 + dns2) serves. This file is the truth: stage 5 adds what is
# missing and removes what is not listed (records of the types below; blocklists).

# The cluster's own domain. Technitium can NEVER change it after the cluster is created.
# It is also the zone for internal names below.
dns_cluster_domain: lab.wsiwiec.com

# Same lists as AdGuard on komoda (2026-10-04). Technitium reads hosts files, plain domain lists and
# the AdGuard/Adblock "||domain^" format. Updated every 24 hours.
dns_blocklists:
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt # AdGuard DNS filter
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt # AdAway Default Blocklist
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_33.txt # Steven Black's List
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_41.txt # POL: CERT Polska malicious domains
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_14.txt # POL: Polish filters for Pi-hole
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_51.txt # HaGeZi's Pro++
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_71.txt # HaGeZi's DNS Rebind Protection
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_54.txt # HaGeZi's DynDNS Blocklist
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_56.txt # HaGeZi's The World's Most Abused TLDs
  - https://v.firebog.net/hosts/Easyprivacy.txt
  - https://v.firebog.net/hosts/Prigent-Ads.txt
  - https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
  - https://hostfiles.frogeye.fr/firstparty-trackers-hosts.txt
  - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt
  - https://v.firebog.net/hosts/Prigent-Crypto.txt
  - https://phishing.army/download/phishing_army_blocklist_extended.txt
  - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-malware.txt
  - https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt
  - https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/hosts
  - https://urlhaus.abuse.ch/downloads/hostfile/
  - https://lists.cyberhost.uk/malware.txt
  - https://v.firebog.net/hosts/static/w3kbl.txt
  - https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
  - https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext
  - https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts

# Zones and their records. Names are relative to the zone ("@" = the zone itself, "*" = any name below).
# Record types stage 5 manages: A, CNAME, ANAME (ANAME = CNAME that is allowed at "@"; Technitium-only,
# so not in lab.wsiwiec.com: the cluster signs that zone with DNSSEC, which ANAME doesn't support).
#   lab.wsiwiec.com  internal only: everything in it is answered here.
#   wsiwiec.com      public domain: names listed here are answered here, any other name would be looked up
#                    on the internet. Today "*" sends every name to externum, like AdGuard did, so your own
#                    devices reach it directly instead of through the internet.
# The 10.20.0.53/.100/.101 addresses are today's komoda/externum/internum (temporary, on torus).
dns_zones:
  lab.wsiwiec.com:
    type: primary
    records:
      - { name: dns1, type: A, value: "{{ hostvars.dns1.address }}" }
      - { name: dns2, type: A, value: "{{ hostvars.dns2.address }}" }
      - { name: arcane, type: A, value: "{{ hostvars.arcane.address }}" }
      - { name: kestrel, type: A, value: "{{ hostvars.kestrel.address }}" }
      - { name: torus, type: A, value: "{{ hostvars.torus.address }}" }
      - { name: proxmox.raw, type: A, value: 10.1.0.2 } # kestrel's web UI (old name, kept)
      - { name: core, type: A, value: 10.20.0.53 } # komoda
      - { name: internum, type: A, value: 10.20.0.101 }
      - { name: externum, type: A, value: 10.20.0.100 }
      - { name: valkey.core, type: CNAME, value: core.lab.wsiwiec.com }
      - { name: adguard, type: CNAME, value: core.lab.wsiwiec.com }
      - { name: proxmox, type: CNAME, value: core.lab.wsiwiec.com }
      - { name: whoami_core, type: CNAME, value: core.lab.wsiwiec.com }
      - { name: "@", type: A, value: 10.20.0.101 } # internum (no ANAME: this zone is DNSSEC-signed)
      - { name: "*", type: A, value: 10.20.0.101 } # internum
  wsiwiec.com:
    type: forwarder # our records first, the rest from the internet
    records:
      - { name: "@", type: ANAME, value: externum.lab.wsiwiec.com }
      - { name: "*", type: A, value: 10.20.0.100 } # externum
